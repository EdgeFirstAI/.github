# Caller skeleton — copy into the product repository as .github/workflows/ci.yml
# Pin uses: and shared-sha to the same EdgeFirstAI/.github commit.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
      hardware:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      full: ${{ steps.mode.outputs.full }}
      hardware: ${{ steps.mode.outputs.hardware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            code:
              - 'crates/**'
              - 'src/**'
              - 'tests/**'
              - 'Cargo.*'
              - 'pyproject.toml'
              - '.github/**'
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          DISPATCH_FULL: ${{ inputs.full }}
          DISPATCH_HARDWARE: ${{ inputs.hardware }}
        run: |
          full=false
          hardware=false
          case "$EVENT_NAME" in
            merge_group) full=true ;;
            workflow_dispatch)
              full="$DISPATCH_FULL"
              hardware="$DISPATCH_HARDWARE"
              ;;
            pull_request)
              if [[ "$EVENT_ACTION" == labeled ]]; then
                case "$LABEL_NAME" in
                  ci:full) full=true ;;
                  ci:hardware) hardware=true ;;
                esac
              fi
              ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "hardware=$hardware" >> "$GITHUB_OUTPUT"

  quick:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-quick.yml@eec0cb31b6576a47735099b91e39a9bdb5fbde3a
    with:
      python: false
      shared-sha: eec0cb31b6576a47735099b91e39a9bdb5fbde3a

  full:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.hardware == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@eec0cb31b6576a47735099b91e39a9bdb5fbde3a
    with:
      lanes: ${{ needs.changes.outputs.full == 'true' && 'all' || 'hardware' }}
      boards: nxp-imx8mp-latest
      runner-class-linux: hosted
      shared-sha: eec0cb31b6576a47735099b91e39a9bdb5fbde3a
    secrets: inherit

  ci-gate:
    if: always()
    needs: [changes, quick, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
