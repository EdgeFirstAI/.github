# Caller skeleton — pin uses: to the EdgeFirstAI/.github commit that has tag-release.yml.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@eec0cb31b6576a47735099b91e39a9bdb5fbde3a
    secrets: inherit
