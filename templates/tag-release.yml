# Replace the all-zero placeholder in every EdgeFirstAI/.github `uses:` with
# the commit you intend to pin, then let Dependabot bump it. Third-party
# actions below are pinned for real and can be copied as-is.
#
# The placeholder is deliberate. A real SHA here goes stale the moment the
# shared repository moves, and a stale one is worse than an obviously invalid
# one: it resolves, so a copied skeleton silently runs old CI, or forwards an
# input the pinned revision does not declare. An unresolvable ref fails
# immediately and says what to fix.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@0000000000000000000000000000000000000000
    with:
      # No tag unless the release build is green for the exact commit being
      # merged. Branch protection requires ci-gate only, and the release build
      # runs on a branch push rather than on the PR, so this is the one place
      # "the artifacts exist before the tag does" is actually enforced.
      # Leave it empty in a repository whose release still builds on the tag.
      require-build: release.yml
    secrets: inherit
