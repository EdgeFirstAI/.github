# Replace the all-zero placeholder in every EdgeFirstAI/.github `uses:` with
# the commit you intend to pin, then let Dependabot bump it. Third-party
# actions below are pinned for real and can be copied as-is.
#
# PUBLISH. This is step 3 of 3; see templates/release.yml for the chain.
#
# It builds nothing. The shared workflow finds the release.yml run that built
# this tag's artifacts, proves that run produced the tree the tag points at,
# downloads them and publishes. A missing artifact, an expired artifact or a
# tree mismatch fails the publish rather than falling back to a build.
#
# MIGRATE THE WORKFLOWS FIRST, IN THEIR OWN PULL REQUEST.
#
# GitHub will not dispatch a workflow that is not on the default branch, and
# merging a release PR fires tag-release.yml immediately — so a repository that
# introduces this file *in* its release PR can never rehearse: the file is
# absent from main until the merge, and the merge creates the tag. Land ci.yml,
# nightly.yml, release.yml, tag-release.yml and publish.yml as an ordinary pull
# request, then cut the release branch. Step 2 below depends on it.
#
# BEFORE THE FIRST TAG in a repository, in this order:
#
#   1. Re-point every PyPI and crates.io Trusted Publisher from release.yml to
#      publish.yml. Both match on workflow FILENAME, so splitting the chain
#      breaks them until they are updated — and the rehearsal below will NOT
#      catch it, because a rehearsal skips the upload. VERIFY it rather than
#      assume it: ara2-rs v0.18.0 failed on exactly this, with crates.io
#      answering "Expected workflow filenames: release.yml".
#   2. Run the workflow_dispatch rehearsal below against a release branch that
#      has a green build. It resolves, verifies and downloads everything and
#      publishes nothing.
#   3. Only then merge the release PR and let the tag fire.

name: Publish

on:
  push:
    tags: ['v*.*.*']              # vX.Y.Z and vX.Y.Z-rcN
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, e.g. v1.2.0 (publishes nothing)'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  # No cancel-in-progress. A half-finished publish is not a state anything can
  # recover from: crates.io and PyPI uploads are irreversible.
  cancel-in-progress: false

jobs:
  publish:
    uses: EdgeFirstAI/.github/.github/workflows/publish-rust.yml@0000000000000000000000000000000000000000
    with:
      tag: ${{ inputs.tag }}
      build-workflow: release.yml
      publish-crates: true
      # Dependency order. crates.io is the one target where a partial publish
      # cannot be undone by re-running the job.
      crate-packages: ""
    permissions:
      contents: write             # create the GitHub Release
      actions: read               # read the release.yml run and its artifacts
      id-token: write             # OIDC trusted publishing
    secrets: inherit

  # PyPI matches job_workflow_ref in the PUBLISHER repository, so a reusable
  # workflow in EdgeFirstAI/.github cannot be a Trusted Publisher
  # (https://docs.pypi.org/trusted-publishers/troubleshooting/). This job stays
  # here. Re-check pypi/warehouse#11096 / PR 20083; if merged, fold it into
  # publish-rust.yml. Composite actions from the shared repo are fine inside
  # it — only reusable workflows change the claim — but the upload itself is
  # not one of them, for the reason on the upload step below.
  #
  # The artifacts were staged into this run by the job above, so this is a
  # plain download with no run-id and no actions: read of its own.
  publish-pypi:
    needs: publish
    # Runs on a rehearsal too: staging is unconditional and only the upload
    # step is gated. A rehearsal whose job is skipped proves nothing about the
    # files; the point of rehearsing is to discover an empty or wrong set
    # BEFORE the tag, not after the crates have already gone out.
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      # The job stays here because it must: PyPI Trusted Publishing matches
      # job_workflow_ref in the publishing repository, so a reusable workflow
      # cannot be the publisher. An action inside the job does not change the
      # claim, so the selection and verification are still shared.
      #
      # One call per distribution. A repository shipping several needs that
      # anyway, since each has its own PyPI environment.
      - uses: EdgeFirstAI/.github/.github/actions/stage-pypi@0000000000000000000000000000000000000000
        with:
          distribution: your-distribution-name
          # Asserts every selected file carries it. A PyPI version is immutable,
          # so a file for the wrong one is found when it cannot be corrected.
          version: ${{ needs.publish.outputs.version }}

      # Directly in the job, never through a composite action. This action
      # resolves its own container image from the repository it is called
      # from; called through one of ours it resolves to that repository and
      # fails on an image that does not exist.
      #
      # publish-registries, not publishing: false for a rehearsal AND for a
      # release candidate whose manifests still carry the base version, where
      # uploading would consume the version the final release needs. The
      # shared workflow decides; this job obeys.
      - name: Upload to PyPI
        if: ${{ needs.publish.outputs.publish-registries == 'true' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          packages-dir: dist
          # A release shipping several distributions can fail part way
          # through, and the retry must not fail on the ones that landed.
          skip-existing: true
