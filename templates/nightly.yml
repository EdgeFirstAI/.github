# Caller skeleton — pin uses: and shared-sha to the same EdgeFirstAI/.github commit.

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@eec0cb31b6576a47735099b91e39a9bdb5fbde3a

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@eec0cb31b6576a47735099b91e39a9bdb5fbde3a
    with:
      lanes: all
      nightly: true
      runner-class-linux: hosted
      shared-sha: eec0cb31b6576a47735099b91e39a9bdb5fbde3a
    secrets: inherit
