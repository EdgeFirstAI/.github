    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@ca1dd553f352cbdf0d80c0abe2d52237c6964f25  # v1.0.0

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@ca1dd553f352cbdf0d80c0abe2d52237c6964f25  # v1.0.0
    with:
      lanes: all
      nightly: true
      runner-class-linux: hosted
    secrets: inherit
