# Caller skeleton — copy into the product repository as .github/workflows/nightly.yml
# Replace the all-zero placeholder in every EdgeFirstAI/.github `uses:` with
# the commit you intend to pin, then let Dependabot bump it. Third-party
# actions below are pinned for real and can be copied as-is.
#
# The placeholder is deliberate. A real SHA here goes stale the moment the
# shared repository moves, and a stale one is worse than an obviously invalid
# one: it resolves, so a copied skeleton silently runs old CI, or forwards an
# input the pinned revision does not declare. An unresolvable ref fails
# immediately and says what to fix.

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@0000000000000000000000000000000000000000
    with:
      # `inputs` is null on a schedule trigger, so the fallback is required;
      # without it the expression yields an empty string and the gate's
      # boolean input rejects it.
      force: ${{ inputs.force || false }}

  # Deliberately not `needs: changed`. cargo audit answers a question about
  # the RustSec database, not about the code, so gating it would go quiet
  # exactly when a new advisory lands against an unchanged main. It reads
  # Cargo.lock without building, on a free standard runner, so running it
  # every night costs nothing.
  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@0000000000000000000000000000000000000000

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@0000000000000000000000000000000000000000
    with:
      lanes: all
      nightly: true
      runner-class-linux: hosted
    secrets: inherit
