# Caller skeleton — pin uses: and shared-sha to the same EdgeFirstAI/.github commit.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: EdgeFirstAI/.github/.github/workflows/release-rust.yml@eec0cb31b6576a47735099b91e39a9bdb5fbde3a
    with:
      dry-run: false
      publish-crates: true
      build-wheels: true
      shared-sha: eec0cb31b6576a47735099b91e39a9bdb5fbde3a
    secrets: inherit

  # PyPI Trusted Publishing cannot use a reusable workflow in another repository
  # (job_workflow_ref). Keep this job in the product repo. Re-check
  # pypi/warehouse#11096 / PR 20083; if merged, fold this into release-rust.yml.
  publish-pypi:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          packages-dir: dist
