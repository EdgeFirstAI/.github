# Replace the all-zero placeholder in every EdgeFirstAI/.github `uses:` with
# the commit you intend to pin, then let Dependabot bump it. Third-party
# actions below are pinned for real and can be copied as-is.
#
# The placeholder is deliberate. A real SHA here goes stale the moment the
# shared repository moves, and a stale one is worse than an obviously invalid
# one: it resolves, so a copied skeleton silently runs old CI, or forwards an
# input the pinned revision does not declare. An unresolvable ref fails
# immediately and says what to fix.
#
# RELEASE BUILD. This is step 1 of 3:
#
#   release.yml      push to release/*.*.*  -> build every artifact  (this file)
#   tag-release.yml  release PR merged      -> annotated vX.Y.Z tag
#   publish.yml      push of a v*.*.* tag   -> publish what was built
#
# It runs on `push` to the release branch rather than on `pull_request` for two
# reasons. A pull_request run builds a merge-preview commit that exists nowhere
# in history, so publish.yml could never bind its artifacts to the tag; a push
# run builds the branch head, which is the commit the release PR merges. And
# confining the expensive build to release branches keeps it off every ordinary
# push, which is the whole point of the tiered model.
#
# Accepting the release PR is the gate. It cannot merge until this is green,
# and green here means every artifact the release will ship already exists.

name: Release Build

on:
  push:
    branches: ['release/*.*.*']   # release/X.Y.Z and release/X.Y.Z-rcN
  workflow_dispatch:              # rebuild a release branch on demand

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true        # a fixup commit supersedes the build it interrupts

jobs:
  # Version consistency across Cargo.toml / pyproject.toml / VERSION against
  # the branch name, plus the changelog section publish.yml will need, plus the
  # full SBOM. Fails the release PR rather than the tag.
  verify:
    uses: EdgeFirstAI/.github/.github/workflows/release-rust.yml@0000000000000000000000000000000000000000
    with:
      sbom: true
      # Package NAMES the release ships, in dependency order. The list is
      # recorded beside the .crate files and publish.yml refuses to publish a
      # different one, so the value here and in publish.yml cannot drift.
      # `cargo publish --no-verify` on the tag is only safe because packaging
      # was exercised here. Set `package-crates: false` for a repository that
      # publishes no crate.
      crate-packages: ""
    secrets: inherit

  # Wheels, for a repository shipping a PyO3/maturin binding. Delete this job
  # if it ships none. The default matrix is manylinux2014 for x86_64 and
  # aarch64 Linux with the sdist on x86_64, which is what the EdgeFirst
  # bindings ship; override `runners` for anything else.
  wheels:
    needs: verify
    uses: EdgeFirstAI/.github/.github/workflows/release-wheels.yml@0000000000000000000000000000000000000000
    with:
      manifest: crates/your-python-crate/Cargo.toml
      # features: pyo3/abi3-py311
      # env: PYO3_CROSS_PYTHON_VERSION=3.11
    secrets: inherit

  # ---------------------------------------------------------------------
  # Anything the two shared jobs above do not build goes here -- C API
  # archives, container images, binaries. Crates and wheels are no longer
  # repository-specific and should not be re-implemented below. Two rules make
  # whatever is left work with publish.yml:
  #
  #   1. retention-days must be 30 or more. The release-PR-to-tag gap is
  #      human-paced, and publish.yml fails on an expired artifact rather
  #      than rebuilding.
  #   2. if-no-files-found: error. A silently empty artifact becomes a
  #      silently incomplete release.
  # ---------------------------------------------------------------------
  build:
    needs: verify
    strategy:
      fail-fast: false            # one broken target must not hide the rest
      # The documented default for a release build is the `larger` class (see
      # the runner selection policy). These hosted labels are placeholders so a
      # copied skeleton cannot bill before anyone has reviewed it; pick the
      # class deliberately when you replace the build below.
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Deliberately no second checkout of EdgeFirstAI/.github here. The
      # `uses:` pin above is the only place the shared commit may appear --
      # a `ref:` on a second checkout is a separate source of truth that
      # Dependabot does not bump, so the two drift and a run silently mixes
      # versions. Set the toolchain up with the same actions this repository's
      # ci.yml already uses.
      - name: Build distribution artifacts
        run: |
          echo "Replace with this repository's real build."
          mkdir -p dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
