name: Resolve lanes
description: >
  Resolve rust-full.yml's lane selection and runner classes, and emit them as
  action outputs.

  It wraps `scripts/resolve_lanes.py` so the workflow can reach it through the
  self-repository `$/` reference rather than checking this repository out to
  run a file from it. The script keeps its own `--self-test`, which ci.yml
  runs; this file adds no logic of its own.

inputs:
  lanes:
    required: false
    default: all
  boards:
    required: false
    default: ""
  runner-class-linux:
    required: false
    default: hosted
  runner-class-linux-arm:
    required: false
    default: hosted
  runner-class-macos:
    required: false
    default: hosted
  runner-class-windows:
    required: false
    default: hosted
  skip-macos:
    required: false
    default: "false"
  skip-windows:
    required: false
    default: "false"
  nightly:
    required: false
    default: "false"
  gpu-args:
    required: false
    default: ""

outputs:
  # Declared one by one because a composite action's outputs are the only
  # thing a caller can read. The inner step's `$GITHUB_OUTPUT` writes are
  # scoped to this file; `steps.<id>.outputs.<key>` at the call site resolves
  # against this block, so a key missing here reads as an empty string and
  # silently disables the lane that tested it.
  linux:
    description: Runner label for the x86_64 Linux lane.
    value: ${{ steps.resolve.outputs.linux }}
  linux_arm:
    description: Runner label for the aarch64 Linux lane.
    value: ${{ steps.resolve.outputs.linux_arm }}
  macos:
    description: Runner label for the macOS lane.
    value: ${{ steps.resolve.outputs.macos }}
  windows:
    description: Runner label for the Windows lane.
    value: ${{ steps.resolve.outputs.windows }}
  gpu:
    description: Runner labels for the CUDA lane.
    value: ${{ steps.resolve.outputs.gpu }}
  do_host:
    description: Whether the host lanes run.
    value: ${{ steps.resolve.outputs.do_host }}
  do_arm:
    description: Whether the aarch64 Linux lane runs; also true for a hardware-only run, which needs the archive.
    value: ${{ steps.resolve.outputs.do_arm }}
  do_macos:
    description: Whether the macOS lane runs.
    value: ${{ steps.resolve.outputs.do_macos }}
  do_windows:
    description: Whether the Windows lane runs.
    value: ${{ steps.resolve.outputs.do_windows }}
  do_hardware:
    description: Whether the board lane runs.
    value: ${{ steps.resolve.outputs.do_hardware }}
  do_gpu:
    description: Whether the CUDA lane runs.
    value: ${{ steps.resolve.outputs.do_gpu }}
  do_nightly:
    description: Whether the nightly-only steps run.
    value: ${{ steps.resolve.outputs.do_nightly }}
  same_repo:
    description: Whether the trigger is positively trusted; false forces every lane hosted and disables board and GPU.
    value: ${{ steps.resolve.outputs.same_repo }}
  board_matrix:
    description: JSON matrix of boards for the hardware lane.
    value: ${{ steps.resolve.outputs.board_matrix }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        LANES: ${{ inputs.lanes }}
        BOARDS: ${{ inputs.boards }}
        CLASS_LINUX: ${{ inputs.runner-class-linux }}
        CLASS_ARM: ${{ inputs.runner-class-linux-arm }}
        CLASS_MAC: ${{ inputs.runner-class-macos }}
        CLASS_WIN: ${{ inputs.runner-class-windows }}
        SKIP_MAC: ${{ inputs.skip-macos }}
        SKIP_WIN: ${{ inputs.skip-windows }}
        NIGHTLY: ${{ inputs.nightly }}
        GPU_ARGS: ${{ inputs.gpu-args }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
      # `$GITHUB_ACTION_PATH` is this action's own directory on the runner,
      # which is how a composite action reaches a file beside it without the
      # caller's workspace being involved at all.
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/resolve_lanes.py"
