name: SBOM tools
description: Install SBOM tooling and run the org license policy
inputs:
  mode:
    description: dependency (cyclonedx + policy) or full (plus scancode)
    required: false
    default: dependency
  project-name:
    description: PROJECT_NAME for generate_sbom.sh
    required: true
  project-type:
    description: library, application, or framework
    required: false
    default: library
  version-file:
    description: File to read the version from
    required: false
    default: Cargo.toml
  source-dirs:
    description: Directories for the scancode pass
    required: false
    default: src tests crates
  output-dir:
    description: Directory to write sbom.json
    required: false
    default: sbom
  notice-file:
    description: NOTICE path
    required: false
    default: NOTICE
  targets:
    description: >-
      Space-separated Rust target triples to resolve the dependency graph for,
      in addition to the host. A graph is per-target, so a host-only scan misses
      every target-conditional dependency. Empty keeps the host-only behaviour.
    required: false
    default: ''
  extra-manifests:
    description: >-
      Space-separated Cargo.toml paths outside the workspace, which `--all`
      cannot reach. Workspace-excluded packages are often the shipped artifacts,
      so omitting them understates what the SBOM describes.
    required: false
    default: ''
  python-requirements:
    description: >-
      Space-separated requirements files for a Python application without a
      pyproject.toml, such as the one its image installs with `pip install
      -r`. They are installed into a fresh environment and inventoried with
      their licenses. Empty keeps the manifest detection.
    required: false
    default: ''
  python-version:
    description: >-
      Python the dependency environment of a pyproject.toml or
      python-requirements is built on: the one the code runs on, such as its
      image's. Dependency resolution depends on it. Needs uv or that
      interpreter on PATH. Empty keeps uv's choice, or python3.
    required: false
    default: ''
  upload-name:
    description: Artifact name; empty skips upload
    required: false
    default: sbom
  retention-days:
    description: >
      Artifact retention. Empty keeps the default, which is tuned for a CI
      artifact nothing outlives the run. A release SBOM is consumed by
      publish.yml after the release PR merges, which is human-paced, so the
      release path passes 30 or more.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install cargo-cyclonedx
      if: hashFiles('Cargo.toml') != ''
      uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037  # v2.87.32
      with:
        tool: cargo-cyclonedx

    - name: Install cyclonedx-py
      if: hashFiles('pyproject.toml') != '' || inputs.python-requirements != ''
      shell: bash
      run: |
        python3 -m venv "${RUNNER_TEMP}/cyclonedx"
        "${RUNNER_TEMP}/cyclonedx/bin/pip" install 'cyclonedx-bom==7.3.0'
        echo "${RUNNER_TEMP}/cyclonedx/bin" >> "$GITHUB_PATH"

    # generate_sbom.sh installs scancode into venv/ when it needs it: full
    # mode scans sources, and any mode scans the licence texts of components
    # whose metadata declares no readable licence. Restoring is cheap; the
    # cache is saved only when the run created venv/.
    # The venv holds compiled wheels and links to the interpreter that built
    # it, so it is only reusable on the same architecture and Python.
    - name: Python for the scancode venv
      id: scancode-python
      shell: bash
      run: echo "version=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

    - name: Cache scancode venv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: venv
        key: scancode-${{ runner.os }}-${{ runner.arch }}-py${{ steps.scancode-python.outputs.version }}-32.4.1-click8.2

    - name: Generate SBOM and check policy
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
        PROJECT_TYPE: ${{ inputs.project-type }}
        VERSION_FILE: ${{ inputs.version-file }}
        SOURCE_DIRS: ${{ inputs.source-dirs }}
        SBOM_MODE: ${{ inputs.mode }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        NOTICE_FILE: ${{ inputs.notice-file }}
        SBOM_TARGETS: ${{ inputs.targets }}
        SBOM_EXTRA_MANIFESTS: ${{ inputs.extra-manifests }}
        PYTHON_REQUIREMENTS: ${{ inputs.python-requirements }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        SCRIPT_DIR: ${{ github.action_path }}/../../scripts
      run: |
        chmod +x "$SCRIPT_DIR/generate_sbom.sh"
        "$SCRIPT_DIR/generate_sbom.sh"

    - name: Upload SBOM
      if: inputs.upload-name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.upload-name }}
        path: ${{ inputs.output-dir }}/sbom.json
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days != '' && inputs.retention-days || (inputs.mode == 'full' && 7 || 1) }}

    # generate_sbom.sh writes the NOTICE the SBOM calls for before its checks;
    # when a check fails, it is the file to review and commit.
    - name: Upload the NOTICE this SBOM calls for
      if: failure() && inputs.upload-name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.upload-name }}-notice
        path: ${{ inputs.output-dir }}/NOTICE
        if-no-files-found: ignore
        retention-days: 7
