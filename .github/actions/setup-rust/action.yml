name: Setup Rust
description: Install the repo toolchain, restore cargo cache, and optional tools
inputs:
  components:
    description: rustup components
    required: false
    default: rustfmt, clippy
  targets:
    description: Extra rustup targets, comma-separated
    required: false
    default: ""
  tools:
    description: taiki-e/install-action tool list (nextest, cargo-llvm-cov, ...)
    required: false
    default: ""
  cache-key:
    description: Swatinem rust-cache shared-key (one per profile/target)
    required: true
  save-cache:
    description: "If true, save the cache. Default: only on main."
    required: false
    default: ""
  workspaces:
    description: rust-cache workspaces argument
    required: false
    default: ""
  require-cc:
    description: >-
      Ensure a C compiler is present. Rust links through `cc`, and any
      dependency with a build script needs one, so a runner image without it
      fails on the first crate rather than at setup. Installed on Linux where
      that is possible; reported on macOS and Windows, where the toolchain is
      a property of the image.
    required: false
    default: "true"
  cross-cc-targets:
    description: >-
      Comma-separated target triples that will be compiled FOR. Installs the
      matching cross C toolchain and points the cargo linker at it. A
      check-only pass still runs cc-rs for any dependency with a build script,
      which needs a compiler for the target, not for the host.
    required: false
    default: ""
  require-lockfile:
    description: >-
      Fail with a policy message when Cargo.lock is absent. Every shared lane
      runs --locked, so a repository that gitignores its lockfile otherwise
      fails partway through with cargo's own wording rather than at setup.
    required: false
    default: "true"
outputs:
  toolchain:
    description: The toolchain channel that was installed
    value: ${{ steps.channel.outputs.channel }}
runs:
  using: composite
  steps:
    - name: Cargo environment
      shell: bash
      run: |
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "CARGO_NET_RETRY=10" >> "$GITHUB_ENV"
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"

    # Every lane passes --locked. Without a lockfile cargo reports "cannot
    # create the lock file ... because --locked was passed", which is accurate
    # but reads as a cargo problem rather than as the CI contract it is, and it
    # arrives after the toolchain and cache steps have already run.
    - name: Cargo.lock is committed
      if: inputs.require-lockfile == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f Cargo.lock ]]; then
          exit 0
        fi
        if [[ ! -f Cargo.toml ]]; then
          echo "::notice::No Cargo.toml at the repository root; skipping the lockfile check."
          exit 0
        fi
        echo "::error::Cargo.lock is not present. Every shared lane runs --locked."
        echo "::error::Commit it: drop any Cargo.lock entry from .gitignore, run"
        echo "::error::'cargo check', and commit the result. A lockfile in a library"
        echo "::error::is ignored by downstream consumers, so this costs them nothing."
        exit 1

    # rust-toolchain.toml is the repository's pin and the thing cargo obeys: it
    # switches to that channel on the first cargo invocation whatever is
    # installed here. Installing `stable` regardless would fetch a second
    # toolchain and, worse, put `components` and `targets` on it -- so a
    # repository pinning a channel without listing components in its toml would
    # reach `cargo clippy` with no clippy on the active toolchain. Reading the
    # pin here means one toolchain, carrying the components the lanes need.
    - name: Resolve toolchain channel
      id: channel
      shell: bash
      run: |
        set -euo pipefail
        channel=stable
        for f in rust-toolchain.toml rust-toolchain; do
          [[ -f "$f" ]] || continue
          # TOML accepts both quote forms, so `channel = '1.85.0'` is as valid
          # a pin as `channel = "1.85.0"`. Reading only one of them would
          # reinstate exactly the mismatch this step exists to remove: cargo
          # would switch to the pinned channel while the components went to
          # `stable`. The legacy plain-text file is a bare channel name.
          found="$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p; s/^[[:space:]]*channel[[:space:]]*=[[:space:]]*'"'"'([^'"'"']*)'"'"'.*/\1/p' "$f" | head -1)"
          if [[ -z "$found" && "$f" == rust-toolchain ]]; then
            found="$(tr -d '[:space:]' < "$f")"
          fi
          if [[ -n "$found" ]]; then
            channel="$found"
            echo "Pinned by $f: $channel"
          fi
          break
        done
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7  # stable
      with:
        toolchain: ${{ steps.channel.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' || (inputs.save-cache == '' && github.ref == 'refs/heads/main') }}
        workspaces: ${{ inputs.workspaces }}

    # Rust links through `cc`. The GitHub-hosted images provide one, but the
    # organisation's larger-runner images are a different build: measured on
    # ubuntu-24.04-arm-xlarge, where every build script in a workspace failed
    # with `linker "cc" not found` before a single test ran
    # (EdgeFirstAI/ara2-rs run 35382211407). Installing it here rather than in
    # each lane means one implementation for all eleven setup-rust call sites.
    - name: C compiler
      if: inputs.require-cc == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v cc >/dev/null 2>&1; then
          echo "ok  cc is present"
          exit 0
        fi
        if [[ "$RUNNER_OS" != Linux ]]; then
          echo "::error::no C compiler on this $RUNNER_OS image, and it cannot be installed in-line."
          echo "::error::Use a runner image that provides the build toolchain."
          exit 1
        fi
        echo "::notice::installing build-essential (absent from this runner image)"
        sudo apt-get update
        sudo apt-get install -y build-essential
        command -v cc >/dev/null 2>&1 || { echo "::error::cc still absent after install"; exit 1; }

    # A cross pass compiles build-script C for the TARGET. rustup's std for the
    # triple is not enough: cc-rs looks for <triple>-gcc and fails the whole
    # lane when it is missing, which is how an aarch64 clippy pass dies on an
    # x86_64 runner over a single dependency.
    - name: Cross C toolchain
      if: inputs.cross-cc-targets != ''
      shell: bash
      env:
        TARGETS: ${{ inputs.cross-cc-targets }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != Linux ]]; then
          echo "::notice::cross C toolchains are installed on Linux only; skipping."
          exit 0
        fi
        pkgs=()
        declare -A linker_for=()
        IFS=',' read -ra triples <<< "$TARGETS"
        for t in "${triples[@]}"; do
          t="$(echo "$t" | xargs)"
          [[ -z "$t" ]] && continue
          case "$t" in
            aarch64-unknown-linux-gnu)      pkg=gcc-aarch64-linux-gnu;     cc=aarch64-linux-gnu-gcc ;;
            armv7-unknown-linux-gnueabihf)  pkg=gcc-arm-linux-gnueabihf;   cc=arm-linux-gnueabihf-gcc ;;
            arm-unknown-linux-gnueabihf)    pkg=gcc-arm-linux-gnueabihf;   cc=arm-linux-gnueabihf-gcc ;;
            riscv64gc-unknown-linux-gnu)    pkg=gcc-riscv64-linux-gnu;     cc=riscv64-linux-gnu-gcc ;;
            x86_64-unknown-linux-gnu)       continue ;;  # the host on every hosted Linux runner
            *)
              echo "::notice::no known cross C package for '$t'; relying on the image."
              continue
              ;;
          esac
          # Already present, or the runner IS that architecture.
          if command -v "$cc" >/dev/null 2>&1; then
            linker_for["$t"]="$cc"
            continue
          fi
          pkgs+=("$pkg")
          linker_for["$t"]="$cc"
        done
        if [[ ${#pkgs[@]} -gt 0 ]]; then
          echo "::notice::installing ${pkgs[*]}"
          sudo apt-get update
          sudo apt-get install -y "${pkgs[@]}"
        fi
        # cargo reads CARGO_TARGET_<TRIPLE>_LINKER with the triple uppercased
        # and dashes as underscores.
        for t in "${!linker_for[@]}"; do
          var="CARGO_TARGET_$(echo "$t" | tr 'a-z-' 'A-Z_')_LINKER"
          echo "${var}=${linker_for[$t]}" >> "$GITHUB_ENV"
          echo "ok  $t -> ${linker_for[$t]}"
        done

    - name: Install cargo tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab  # v2.87.13
      with:
        tool: ${{ inputs.tools }}
