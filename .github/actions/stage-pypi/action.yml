name: stage for PyPI
description: >
  Select one distribution's files out of a release's artifacts into `dist/` and
  assert they carry the expected version. It stages; it does not upload.

  The caller uploads, with `pypa/gh-action-pypi-publish` as a direct step of its
  own job. That action resolves its own container image from the repository it
  is called from, so called through this one it resolves to this repository and
  fails on an image that does not exist. It also cannot be replaced with a
  reusable workflow: PyPI Trusted Publishing matches `job_workflow_ref` in the
  publishing repository, so the job must live in the product repository.

  What is left here is what is genuinely shareable — the selection and the
  version assertion — and both run in rehearsal exactly as they do on a tag,
  because an empty or wrong file set is the failure they exist to catch.

  Selection is by **filename**, not by artifact name. A wheel filename already
  carries the distribution and the version canonically, so nothing has to agree
  in advance about how a build names its artifacts — which is the coupling that
  otherwise has to be maintained between every build and every publish.

inputs:
  distribution:
    description: >-
      PyPI project name, e.g. `edgefirst-tensor`. Its files are matched as the
      escaped form the wheel filename uses (`-` and `.` become `_`), so a
      repository shipping several distributions calls this once per
      distribution — which it must anyway, since each has its own environment.

      Empty takes every wheel and no sdist: without a distribution to scope
      them, `*.tar.gz` also matches a C API archive, and PyPI rejects it after
      the crates have already published.
    required: false
    default: ""
  artifact:
    description: Artifact to download first. Empty uses `path` as it stands.
    required: false
    default: release-artifacts
  path:
    description: Where the release's files are, or are downloaded to.
    required: false
    default: staged
  version:
    description: >-
      Assert every selected file carries this version. A file for the wrong
      version is unrecoverable once uploaded, because a PyPI version is
      immutable.

      Either spelling of a release candidate is accepted — `1.2.0-rc1` as a
      tag and a release branch spell it, or `1.2.0rc1` as PEP 440 and the
      wheel filename do. The base version of a candidate is not: uploading it
      would consume the version the final release needs.
    required: false
    default: ""

outputs:
  packages-dir:
    description: >-
      Directory holding the selected files, to hand to the caller's
      `pypa/gh-action-pypi-publish` step as `packages-dir`.
    value: dist

runs:
  using: composite
  steps:
    - name: Download the release artifacts
      if: inputs.artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.path }}

    - name: Select this distribution's files
      shell: bash
      env:
        DIST: ${{ inputs.distribution }}
        SRC: ${{ inputs.path }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Collected outside the workspace, then moved into place, so that no
        # relationship between `path` and dist/ can go wrong: `path` may be
        # dist/ itself, a directory inside it, or a parent of it. Selecting
        # straight into dist/ breaks the first -- cp refuses to copy a file
        # onto itself -- and clearing dist/ first breaks the second, by
        # deleting the very files about to be selected.
        staging="$(mktemp -d "${RUNNER_TEMP:-/tmp}/stage-pypi.XXXXXX")"

        if [[ -n "$DIST" ]]; then
          # PEP 427: a wheel filename escapes runs of -, _ and . in the
          # distribution name to a single _. Match that form rather than the
          # project name as written.
          norm="$(printf '%s' "$DIST" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/_/g')"
          # Scoped by the distribution, so an sdist is safe to take here: a C
          # API archive is edgefirst-hal-<version>-<target>.tar.gz and does not
          # match this prefix.
          patterns=("${norm}-*.whl" "${norm}-*.tar.gz")
          echo "selecting $DIST as '${norm}-*'"
        else
          patterns=("*.whl")
          echo "selecting every wheel (no distribution named)"
        fi

        found=0
        for pat in "${patterns[@]}"; do
          while IFS= read -r f; do
            cp "$f" "$staging/"
            found=1
          done < <(find "$SRC" -name "$pat" -type f)
        done

        if [[ "$found" -eq 0 ]]; then
          echo "::error::no files for ${DIST:-any distribution} in $SRC"
          echo "::error::the release build produced:"
          find "$SRC" -type f | sed 's/^/::error::  /'
          rm -rf "$staging"
          exit 1
        fi

        # Replaced wholesale rather than added to, so what a caller uploads is
        # what was selected here and not that plus whatever an earlier step
        # left behind. Nothing has been removed until everything is collected.
        rm -rf dist
        mv "$staging" dist

        if [[ -n "$VERSION" ]]; then
          # PEP 440 spells a candidate 1.2.0rc1 where a tag and a release
          # branch say 1.2.0-rc1, and the wheel filename maturin writes carries
          # the PEP 440 form. Normalise here so a caller may pass either; it is
          # a no-op on a version that is already normalised. Same rule as
          # maturin-build, which checks the wheels at build time.
          pep440="${VERSION//-rc/rc}"

          # Unlike maturin-build, the base version is NOT also accepted. There
          # a mismatch costs a rebuild; here the next step uploads to PyPI,
          # where a 1.2.0 wheel published during the 1.2.0-rc1 release would
          # consume the version the final release needs, permanently.
          #
          # A PyPI version is immutable, so a file naming the wrong one is
          # found when it can no longer be corrected. The version is the second
          # '-' separated field of a wheel and the last of an sdist.
          fail=0
          for f in dist/*; do
            name="$(basename "$f")"
            case "$name" in
              *.whl)    got="$(cut -d- -f2 <<< "$name")" ;;
              *.tar.gz) got="$(sed -E 's/^.*-([0-9][^-]*)\.tar\.gz$/\1/' <<< "$name")" ;;
              *)        continue ;;
            esac
            if [[ "$got" == "$pep440" ]]; then
              echo "ok  $name  ($got)"
            else
              echo "::error::$name carries version '$got', expected '$pep440'"
              fail=1
            fi
          done
          [[ "$fail" -eq 0 ]] || exit 1
        fi

        ls -la dist/

    - name: Summarise what was staged
      shell: bash
      env:
        DIST: ${{ inputs.distribution }}
      run: |
        set -euo pipefail
        {
          echo "### Staged ${DIST:-the selected files} for PyPI"
          echo '```'
          ls -1 dist/
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
