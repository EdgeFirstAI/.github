name: Board run
description: Execute a nextest archive (or custom command) on a board and collect profraw
inputs:
  archive-artifact:
    description: Artifact name produced by the aarch64 instrument job
    required: false
    default: nextest-archive-aarch64
  archive-file:
    description: Path of the archive inside the artifact
    required: false
    default: nextest-archive.tar.zst
  command:
    description: If set, run this instead of cargo nextest run --archive-file
    required: false
    default: ""
  profraw-artifact:
    description: Artifact name for uploaded profraw files
    required: false
    default: coverage-hardware
  profraw-dir:
    description: Directory to collect LLVM profraw into
    required: false
    default: coverage/profraw
  extra-args:
    description: Extra arguments for cargo nextest run
    required: false
    default: ""
  binaries:
    description: >-
      Newline-separated selection of test binaries to execute directly, one per
      line as `<name-prefix>[=<filter>[,<filter>...]]`. A bare prefix runs the
      whole binary; filters run it once per filter as a libtest substring match.
      When set, the archive is only unpacked and each binary is run in a SINGLE
      process, which is what a board needs: nextest runs one process per test,
      and on a GPU board each process pays a full driver init/teardown. Leave
      empty to run the archive through nextest instead.
    required: false
    default: ""
  min-tests:
    description: >-
      Fail if fewer than this many tests were executed. Guards against a
      selection that silently matches nothing, which otherwise reports success.
    required: false
    default: "0"
runs:
  using: composite
  steps:
    # A board runs on a small eMMC and the cleanup below only runs after a
    # successful job, so a failed run leaves its payload behind and the next
    # one fills the disk. Clear it first and record the headroom.
    - name: Reclaim board disk space
      shell: bash
      env:
        PROFRAW_DIR: ${{ inputs.profraw-dir }}
      run: |
        set -euo pipefail
        rm -rf board-archive board-extract board-tmp "$PROFRAW_DIR" target/nextest || true
        find . -name '*.profraw' -delete 2>/dev/null || true
        echo "workspace filesystem:"
        df -h . || true
        echo "/tmp filesystem:"
        df -h /tmp || true

    - name: Download nextest archive
      if: inputs.command == ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.archive-artifact }}
        path: board-archive

    # Boards run tests, never builds: no cargo, and no way to fetch one, since
    # install-action needs jq, curl and a recognised distro that a Yocto board
    # does not have. Prefer a provisioned nextest; otherwise use the static
    # aarch64 binary the aarch64 lane ships inside the archive artifact.
    - name: Resolve nextest
      if: inputs.command == ''
      id: probe
      shell: bash
      env:
        ARCHIVE_DIR: board-archive
      run: |
        set -euo pipefail
        if command -v cargo-nextest >/dev/null 2>&1; then
          echo "runner=$(command -v cargo-nextest)" >> "$GITHUB_OUTPUT"
          echo "using provisioned cargo-nextest"
          exit 0
        fi
        shipped="$(find "$ARCHIVE_DIR" -name cargo-nextest -type f | head -1)"
        if [[ -n "$shipped" ]]; then
          chmod +x "$shipped"
          echo "runner=$(cd "$(dirname "$shipped")" && pwd)/cargo-nextest" >> "$GITHUB_OUTPUT"
          echo "using the static nextest shipped with the archive"
          exit 0
        fi
        echo "::error::no cargo-nextest on this runner and none shipped in $ARCHIVE_DIR"
        exit 1

    # nextest runs ONE PROCESS PER TEST. On a board with a GPU driver that is
    # the dominant cost and not a detail: each process pays a full EGL display
    # init, context creation and teardown, measured at 6-22s per test on an
    # i.MX 8M Plus, and coverage instrumentation writes one profraw per
    # process -- 307 files totalling 2.8 GB on a board with 4.1 GB free, where
    # the same coverage from whole-binary runs is ~20 files and ~190 MB.
    # Running each binary once, as the pre-migration flow did, fixes the
    # runtime and the disk footprint together.
    - name: Run on-target tests (single process per binary)
      if: inputs.command == '' && inputs.binaries != ''
      shell: bash
      env:
        LLVM_PROFILE_FILE: ${{ github.workspace }}/${{ inputs.profraw-dir }}/board-%p-%m.profraw
        ARCHIVE_FILE: ${{ inputs.archive-file }}
        PROFRAW_DIR: ${{ inputs.profraw-dir }}
        NEXTEST_BIN: ${{ steps.probe.outputs.runner }}
        BINARIES: ${{ inputs.binaries }}
        MIN_TESTS: ${{ inputs.min-tests }}
        TMPDIR: ${{ github.workspace }}/board-tmp
        TMP: ${{ github.workspace }}/board-tmp
        TEMP: ${{ github.workspace }}/board-tmp
        EXTRACT_DIR: ${{ github.workspace }}/board-extract
        RESULTS_DIR: ${{ github.workspace }}/board-results
      run: |
        set -euo pipefail
        mkdir -p "$PROFRAW_DIR" "$TMPDIR" "$RESULTS_DIR"
        rm -rf "$EXTRACT_DIR"
        mkdir -p "$EXTRACT_DIR"

        archive="$(find board-archive -name "$(basename "$ARCHIVE_FILE")" | head -1)"
        if [[ -z "$archive" ]]; then
          archive="$(find board-archive -type f ! -name cargo-nextest | head -1)"
        fi
        if [[ -z "$archive" ]]; then
          echo "error: nextest archive not found in board-archive/" >&2
          exit 1
        fi

        # Use nextest purely as the unpacker. It is the only thing that knows
        # the archive layout, and --workspace-remap fixes the build-host paths
        # baked into the binaries. --list-type binaries-only does no work
        # beyond enumerating, so this costs one process, not one per test.
        echo "::group::Unpack archive"
        "$NEXTEST_BIN" nextest list --archive-file "$archive" \
          --extract-to "$EXTRACT_DIR" \
          --workspace-remap "$GITHUB_WORKSPACE" \
          --list-type binaries-only
        echo "::endgroup::"

        deps="$(find "$EXTRACT_DIR/target" -maxdepth 2 -type d -name deps | head -1)"
        if [[ -z "$deps" ]]; then
          echo "error: no target/*/deps directory in the extracted archive" >&2
          exit 1
        fi
        echo "test binaries unpacked to $deps"

        FAILED=0
        TESTS_RUN=0

        run_binary() {
          # $1 executable, $2 libtest substring filter (may be empty), $3 label
          local bin="$1" filter="$2" label="$3"
          local name log rc tee_rc line count
          local -a st
          name="$(basename "$bin")"
          log="$RESULTS_DIR/${name}${label:+-$label}.txt"
          echo "=== $name ${label:+($label)} ==="
          # PIPESTATUS must be read from the test pipeline itself. `|| true`
          # is a pipeline of its own, so under `set -o pipefail` it runs
          # whenever the test binary fails and resets PIPESTATUS to (0) --
          # which silently turned every failing binary into a passing lane.
          # errexit comes off around the pipeline instead, because a failing
          # test binary is an expected outcome here, not a script error.
          set +e
          if [[ -n "$filter" ]]; then
            "$bin" "$filter" --test-threads=1 2>&1 | tee "$log"
          else
            "$bin" --test-threads=1 2>&1 | tee "$log"
          fi
          # One assignment: reading ${PIPESTATUS[0]} is itself a command, and
          # that resets PIPESTATUS to a single element, so a second read for
          # tee would be unbound under `set -u`.
          st=( "${PIPESTATUS[@]}" )
          set -e
          rc=${st[0]}
          tee_rc=${st[1]:-0}
          # A board that has run out of disk fails the write, not the test,
          # and the summary parse below would then read an empty log and
          # report zero tests rather than a problem.
          if [[ $tee_rc -ne 0 ]]; then
            echo "::error::could not write $log (tee exit $tee_rc); the board may be out of disk"
            FAILED=1
          fi

          # "test result: ok. 12 passed; 0 failed; ..." -- sum the passed and
          # failed counts so a selection that matches nothing is visible.
          line="$(grep -E '^test result:' "$log" | tail -1 || true)"
          if [[ -n "$line" ]]; then
            count="$(echo "$line" | sed -n 's/.* \([0-9]\+\) passed.*/\1/p')"
            TESTS_RUN=$(( TESTS_RUN + ${count:-0} ))
          fi

          if [[ $rc -ne 0 ]]; then
            # The Vivante driver SIGABRTs while unloading its library, after
            # the test body has already passed. Whole-binary runs surface that
            # as the binary's exit code, so a clean libtest summary with no
            # failures is the signal that the abort was the teardown, not a
            # test. nextest cannot make this distinction because it charges
            # the abort to whichever test happened to be in that process.
            if grep -q 'test result: ok' "$log" && ! grep -qE '^failures:|FAILED' "$log"; then
              echo "::warning::$name ${label:+($label) }exited $rc after all tests passed (driver abort during unload)"
            else
              echo "::error::$name ${label:+($label) }failed with exit $rc"
              FAILED=1
            fi
          fi
        }

        while IFS= read -r spec; do
          spec="$(echo "$spec" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ -z "$spec" || "$spec" == \#* ]] && continue
          prefix="${spec%%=*}"
          filters=""
          [[ "$spec" == *=* ]] && filters="${spec#*=}"

          matched=0
          for bin in "$deps/$prefix"-*; do
            [[ -f "$bin" && -x "$bin" ]] || continue
            case "$bin" in *.so|*.d|*.rlib|*.rmeta) continue ;; esac
            matched=1
            if [[ -z "$filters" ]]; then
              run_binary "$bin" "" ""
            else
              IFS=',' read -ra fl <<< "$filters"
              for f in "${fl[@]}"; do
                run_binary "$bin" "$f" "$f"
              done
            fi
          done
          if [[ $matched -eq 0 ]]; then
            echo "::error::no test binary matching '$prefix-*' in $deps"
            FAILED=1
          fi
        done <<< "$BINARIES"

        echo "executed $TESTS_RUN tests across the selected binaries"
        if [[ "$MIN_TESTS" -gt 0 && "$TESTS_RUN" -lt "$MIN_TESTS" ]]; then
          echo "::error::only $TESTS_RUN tests ran, expected at least $MIN_TESTS -- the selection matched less than intended"
          FAILED=1
        fi
        echo "profraw written: $(find "$PROFRAW_DIR" -name '*.profraw' | wc -l)"
        exit $FAILED

    - name: Run on-target tests
      if: inputs.command != '' || inputs.binaries == ''
      shell: bash
      env:
        LLVM_PROFILE_FILE: ${{ github.workspace }}/${{ inputs.profraw-dir }}/board-%p-%m.profraw
        BOARD_COMMAND: ${{ inputs.command }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        ARCHIVE_FILE: ${{ inputs.archive-file }}
        PROFRAW_DIR: ${{ inputs.profraw-dir }}
        NEXTEST_BIN: ${{ steps.probe.outputs.runner }}
        # A board's /tmp is a small RAM-backed tmpfs. nextest extracts an
        # archive to a temp directory by default, which lands there and runs
        # it out of space long before the workspace filesystem is troubled.
        # Keep every large write on the workspace.
        TMPDIR: ${{ github.workspace }}/board-tmp
        TMP: ${{ github.workspace }}/board-tmp
        TEMP: ${{ github.workspace }}/board-tmp
        EXTRACT_DIR: ${{ github.workspace }}/board-extract
      run: |
        set -euo pipefail
        mkdir -p "$PROFRAW_DIR" "$TMPDIR"
        # nextest will not extract into a populated directory, and the
        # cleanup below only runs after a job that got that far.
        rm -rf "$EXTRACT_DIR"
        mkdir -p "$EXTRACT_DIR"
        if [[ -n "$BOARD_COMMAND" ]]; then
          bash -lc "$BOARD_COMMAND"
        else
          archive="$(find board-archive -name "$(basename "$ARCHIVE_FILE")" | head -1)"
          if [[ -z "$archive" ]]; then
            archive="$(find board-archive -type f ! -name cargo-nextest | head -1)"
          fi
          if [[ -z "$archive" ]]; then
            echo "error: nextest archive not found in board-archive/" >&2
            exit 1
          fi
          # Invoke the binary directly: `cargo nextest` needs cargo, which a
          # board does not have.
          # shellcheck disable=SC2086  # EXTRA_ARGS is an argument list and must split
          # --workspace-remap: the archive records the workspace root it was
          # built under (a hosted runner), and the board checks out to a
          # different path, so without this nextest looks for the manifest at
          # the builder's path and fails before running anything.
          "$NEXTEST_BIN" nextest run --archive-file "$archive"             --extract-to "$EXTRACT_DIR"             --workspace-remap "$GITHUB_WORKSPACE" $EXTRA_ARGS
        fi

    - name: Upload profraw
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.profraw-artifact }}
        path: ${{ inputs.profraw-dir }}
        if-no-files-found: warn
        retention-days: 1

    - name: Cleanup board workspace
      if: always()
      shell: bash
      run: |
        rm -rf board-archive board-extract board-tmp board-results "${{ inputs.profraw-dir }}" || true
