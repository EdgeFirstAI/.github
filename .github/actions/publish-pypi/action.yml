name: publish to PyPI
description: >
  Select one distribution's files out of a release's artifacts and upload them
  to PyPI.

  It is an action rather than a reusable workflow because it has to be: PyPI
  Trusted Publishing matches `job_workflow_ref` in the publishing repository,
  so the job must live in the product repository and a reusable workflow cannot
  be the publisher. An action inside that job does not change the claim, which
  leaves the selection and verification shareable even though the job is not.

  Selection is by **filename**, not by artifact name. A wheel filename already
  carries the distribution and the version canonically, so nothing has to agree
  in advance about how a build names its artifacts — which is the coupling that
  otherwise has to be maintained between every build and every publish.

inputs:
  distribution:
    description: >-
      PyPI project name, e.g. `edgefirst-tensor`. Its files are matched as the
      escaped form the wheel filename uses (`-` and `.` become `_`), so a
      repository shipping several distributions calls this once per
      distribution — which it must anyway, since each has its own environment.

      Empty takes every wheel and no sdist: without a distribution to scope
      them, `*.tar.gz` also matches a C API archive, and PyPI rejects it after
      the crates have already published.
    required: false
    default: ""
  artifact:
    description: Artifact to download first. Empty uses `path` as it stands.
    required: false
    default: release-artifacts
  path:
    description: Where the release's files are, or are downloaded to.
    required: false
    default: staged
  version:
    description: >-
      Assert every selected file carries this version. A file for the wrong
      version is unrecoverable once uploaded, because a PyPI version is
      immutable.
    required: false
    default: ""
  publish:
    description: >-
      Upload. False still downloads, selects and verifies, which is what makes
      a rehearsal worth running: the failure it exists to catch is an empty or
      wrong file set, and a job that skips its own checks proves nothing.
    required: false
    default: "true"
  skip-existing:
    description: >-
      Tolerate a file that is already on PyPI. On by default because a release
      shipping several distributions can fail part way through, and the retry
      must not fail on the ones that already landed.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Download the release artifacts
      if: inputs.artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.path }}

    - name: Select this distribution's files
      shell: bash
      env:
        DIST: ${{ inputs.distribution }}
        SRC: ${{ inputs.path }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p dist

        if [[ -n "$DIST" ]]; then
          # PEP 427: a wheel filename escapes runs of -, _ and . in the
          # distribution name to a single _. Match that form rather than the
          # project name as written.
          norm="$(printf '%s' "$DIST" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/_/g')"
          # Scoped by the distribution, so an sdist is safe to take here: a C
          # API archive is edgefirst-hal-<version>-<target>.tar.gz and does not
          # match this prefix.
          patterns=("${norm}-*.whl" "${norm}-*.tar.gz")
          echo "selecting $DIST as '${norm}-*'"
        else
          patterns=("*.whl")
          echo "selecting every wheel (no distribution named)"
        fi

        found=0
        for pat in "${patterns[@]}"; do
          while IFS= read -r f; do
            cp "$f" dist/
            found=1
          done < <(find "$SRC" -name "$pat" -type f)
        done

        if [[ "$found" -eq 0 ]]; then
          echo "::error::no files for ${DIST:-any distribution} in $SRC"
          echo "::error::the release build produced:"
          find "$SRC" -type f | sed 's/^/::error::  /'
          exit 1
        fi

        if [[ -n "$VERSION" ]]; then
          # A PyPI version is immutable, so a file naming the wrong one is
          # found when it can no longer be corrected. The version is the second
          # '-' separated field of a wheel and the last of an sdist.
          fail=0
          for f in dist/*; do
            name="$(basename "$f")"
            case "$name" in
              *.whl)    got="$(cut -d- -f2 <<< "$name")" ;;
              *.tar.gz) got="$(sed -E 's/^.*-([0-9][^-]*)\.tar\.gz$/\1/' <<< "$name")" ;;
              *)        continue ;;
            esac
            if [[ "$got" == "$VERSION" ]]; then
              echo "ok  $name"
            else
              echo "::error::$name carries version '$got', expected '$VERSION'"
              fail=1
            fi
          done
          [[ "$fail" -eq 0 ]] || exit 1
        fi

        ls -la dist/

    - name: Upload to PyPI
      if: inputs.publish == 'true'
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
      with:
        packages-dir: dist
        skip-existing: ${{ inputs.skip-existing }}

    - name: Rehearsal summary
      if: inputs.publish != 'true'
      shell: bash
      env:
        DIST: ${{ inputs.distribution }}
      run: |
        set -euo pipefail
        {
          echo "### Would have published ${DIST:-the selected files} to PyPI"
          echo '```'
          ls -1 dist/
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
