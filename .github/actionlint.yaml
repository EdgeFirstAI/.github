# actionlint configuration.
paths:
  .github/workflows/*.yml:
    ignore:
      # GitHub's self-repository syntax, generally available 2026-07-30: a
      # `uses:` starting with `$/` resolves to the running workflow's own
      # repository at the exact commit already running, so there is no ref to
      # specify and nothing for a SHA pin to drift from. actionlint 1.7.12
      # predates it and reads the missing ref as a malformed action reference.
      #
      # https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax/
      #
      # Requires runner >= 2.336.0. Hosted runners update themselves; every
      # machine in the self-hosted fleet reported 2.337.0 when this landed. A
      # re-provisioned runner below that floor fails these steps outright
      # rather than silently, which is the safe direction.
      #
      # Drop this ignore once actionlint recognises the syntax.
      - 'specifying action "\$/.+" in invalid format because ref is missing'

# This list must track .github/rulesets/runners.json exactly, casing
# included -- it is now a third place the fleet's custom labels are
# written down, and therefore a third place that can drift. There is no
# tooling generating one from the other; keep them in sync by hand.
self-hosted-runner:
  labels:
    - build
    - CUDA
    - Yocto
    - imx8mp
    - imx8mp-evk
    - imx8mp-evk-6.12.34-2.1.0
    - imx8mpevk
    - nxp-imx8mp-latest
    - nxp-imx8mp-6.12.34-2.1.0
