name: usage-report

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Actions usage snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Collect usage
        env:
          GH_TOKEN: ${{ secrets.ORG_BILLING_TOKEN || secrets.ORG_AUDIT_TOKEN || github.token }}
          GH_PAGER: ""
        run: |
          set -euo pipefail
          mkdir -p usage
          date -u +%Y-%m-%dT%H:%M:%SZ > usage/generated_at.txt
          gh api orgs/EdgeFirstAI/actions/cache/usage > usage/cache.json
          gh api "organizations/EdgeFirstAI/settings/billing/usage/summary" > usage/usage-summary.json
          python3 - <<'PY'
          import json, pathlib, datetime
          root = pathlib.Path("usage")
          summary = json.loads((root / "usage-summary.json").read_text(encoding="utf-8"))
          cache = json.loads((root / "cache.json").read_text(encoding="utf-8"))
          items = summary.get("usageItems") or []
          period = summary.get("timePeriod") or {}
          lines = [
              f"# EdgeFirstAI Actions usage {datetime.date.today().isoformat()}",
              "",
              f"Period: {period.get('year', '')}-{period.get('month', '')}.",
              "Larger-runner minutes should trend to zero except recorded `runner-class: larger` exceptions (hal, packaging).",
              "",
              "| Product | SKU | Net qty | Unit | Net amount |",
              "| --- | --- | --- | --- | --- |",
          ]
          if not items:
              lines.append("| _(none)_ |  |  |  |  |")
          else:
              for item in sorted(items, key=lambda row: (row.get("product") or "", row.get("sku") or "")):
                  lines.append(
                      "| {product} | {sku} | {qty} | {unit} | {amount} |".format(
                          product=item.get("product") or "",
                          sku=item.get("sku") or "",
                          qty=item.get("netQuantity", ""),
                          unit=item.get("unitType") or "",
                          amount=item.get("netAmount", ""),
                      )
                  )
          lines += [
              "",
              f"Actions cache: {json.dumps(cache)[:1500]}",
              "",
              "Source: `GET /organizations/{org}/settings/billing/usage/summary`.",
          ]
          pathlib.Path("usage-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: usage-snapshot
          path: usage
          retention-days: 90
      - name: Comment tracking issue
        env:
          GH_TOKEN: ${{ secrets.ORG_BILLING_TOKEN || secrets.ORG_AUDIT_TOKEN || github.token }}
        run: |
          title="CI weekly Actions usage snapshot"
          existing="$(gh issue list --repo EdgeFirstAI/.github --search "$title in:title" --state open --json number --jq '.[0].number' || true)"
          if [[ -z "$existing" || "$existing" == "null" ]]; then
            gh issue create --repo EdgeFirstAI/.github --title "$title" --body-file usage-summary.md
          else
            gh issue comment "$existing" --repo EdgeFirstAI/.github --body-file usage-summary.md
          fi
