name: publish-rust

# Tag side of the three-workflow release chain. See release-rust.yml.
#
# THIS WORKFLOW BUILDS NOTHING. It finds the release.yml run that built the
# artifacts for this tag, proves that run produced the tree the tag points at,
# downloads them and publishes. A missing artifact, an expired artifact or a
# tree mismatch fails the publish; there is deliberately no fallback to a
# build, because a deploy-only pipeline that cannot prove which build it is
# shipping is worse than one that rebuilds.
#
# The one exception is `cargo publish`, which has no pre-built input: it always
# packages from a source tree. It is bounded by --no-verify, so the tag path
# never runs a verification compile, and by the release branch having already
# compiled and tested the same tree.
#
# Publishing is gated on this being a real tag push. A workflow_dispatch
# resolves, verifies and downloads everything and then publishes nothing, which
# makes it a complete rehearsal at no cost. The gate lives here rather than in
# the caller so a caller cannot remove it by accident.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish; required for a workflow_dispatch rehearsal
        type: string
        default: ""
      build-workflow:
        description: Workflow file whose run built the artifacts
        type: string
        default: release.yml
      publish-crates:
        type: boolean
        default: true
      crate-packages:
        description: >-
          Space-separated package NAMES, in dependency order; empty publishes
          the workspace root. When the release build used `release-rust.yml`'s
          packaging job, the list it recorded is authoritative and a value
          here that differs from it fails the publish.
        type: string
        default: ""
      changelog:
        type: string
        default: CHANGELOG.md
      project-name:
        type: string
        default: ${{ github.event.repository.name }}
      require-sbom:
        type: boolean
        default: true
      release-files:
        description: Glob of staged files to attach to the GitHub Release
        type: string
        default: dist/*
      dry-run:
        description: Force a rehearsal even on a tag push
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.resolve.outputs.version }}
      tag:
        value: ${{ jobs.resolve.outputs.tag }}
      prerelease:
        value: ${{ jobs.resolve.outputs.prerelease }}
      build-run-id:
        value: ${{ jobs.resolve.outputs.run-id }}
      publishing:
        description: "false when this run is a rehearsal; gate caller publish jobs on it"
        value: ${{ jobs.resolve.outputs.publishing }}
      publish-registries:
        description: >
          false when nothing may be uploaded to an immutable registry -- a
          rehearsal, or a pre-release whose manifests carry the base version.
          Gate caller PyPI uploads on this, not on `publishing`.
        value: ${{ jobs.resolve.outputs.publish-registries }}
      sha:
        description: Commit the artifacts were verified against; check this out rather than the tag
        value: ${{ jobs.resolve.outputs.sha }}

jobs:
  resolve:
    name: Resolve build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      run-id: ${{ steps.resolve.outputs.run-id }}
      sha: ${{ steps.resolve.outputs.sha }}
      publishing: ${{ steps.resolve.outputs.publishing }}
      publish-registries: ${{ steps.manifests.outputs.registries }}
    steps:
      # Resolve first, check out second. On a pre-tag rehearsal there is no tag
      # to check out yet, so nothing may check out the caller until the resolve
      # has produced the ref to check out. The action itself needs no checkout,
      # which is what makes that order possible.
      - name: Resolve the build
        id: resolve
        uses: $/.github/actions/resolve-release-build
        with:
          build-workflow: ${{ inputs.build-workflow }}
          tag: ${{ inputs.tag }}
          dry-run: ${{ inputs.dry-run }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit the artifacts were verified against, not the tag. On a
          # rehearsal the tag does not exist yet; on a squash merge the tag and
          # the build differ by commit while sharing a tree.
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Manifests, and whether the registries may be used
        id: manifests
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          PUBLISHING: ${{ steps.resolve.outputs.publishing }}
        run: |
          # A registry version is immutable. If v1.2.0-rc1 is tagged while the
          # manifests still say 1.2.0, publishing would consume the version the
          # final release needs and 1.2.0 could never be released. So the rule
          # is mechanical: upload to crates.io and PyPI only when the manifest
          # version is exactly the tag version. A candidate whose manifests
          # carry the base version still gets a GitHub pre-release with all its
          # artifacts attached, which is what a candidate is for.
          base="${VERSION%-rc*}"
          fail=0
          exact=1
          check() {
            local file="$1" found="$2"
            if [[ "$found" == "$VERSION" ]]; then
              echo "ok  $file  $found  (exact)"
            elif [[ "$found" == "$base" && "$PRERELEASE" == true ]]; then
              exact=0
              echo "ok  $file  $found  (base version)"
            else
              echo "::error file=$file::$file version '$found' != tag version '$VERSION'"
              fail=1
            fi
          }
          if [[ -f Cargo.toml ]]; then
            found="$(grep -E '^version\s*=' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
            [[ -n "$found" ]] && check Cargo.toml "$found"
          fi
          if [[ -f pyproject.toml ]] && grep -qE '^version\s*=' pyproject.toml; then
            check pyproject.toml "$(grep -E '^version\s*=' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          if [[ -f VERSION ]]; then
            check VERSION "$(tr -d '[:space:]' < VERSION)"
          fi
          [[ "$fail" -eq 0 ]] || exit 1

          registries=false
          if [[ "$PUBLISHING" == true && "$exact" -eq 1 ]]; then
            registries=true
          fi
          echo "registries=$registries" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISHING" == true && "$exact" -eq 0 ]]; then
            echo "::warning::$VERSION carries the base version $base in its manifests, so crates.io and PyPI are SKIPPED — publishing $base now would make the final release unpublishable. The GitHub pre-release is still created with every artifact."
            echo "- crates.io / PyPI: **skipped** (manifests carry \`$base\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          run-id: ${{ steps.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Require SBOM
        if: ${{ inputs.require-sbom }}
        run: |
          found="$(find dist -name 'sbom.json' | head -1 || true)"
          if [[ -z "$found" ]]; then
            echo "::error::sbom.json is required on every release and was not in the build artifacts"
            exit 1
          fi
          [[ "$found" == dist/sbom.json ]] || cp "$found" dist/sbom.json

      - name: Inventory
        run: |
          find dist -type f | sort | sed 's/^/  /' | tee -a "$GITHUB_STEP_SUMMARY"
          count="$(find dist -type f | wc -l | tr -d ' ')"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Build run produced no files"
            exit 1
          fi

      # Re-uploaded into THIS run so the caller's own publish jobs -- notably
      # the publish-pypi job that Trusted Publishing forces to stay in the
      # product repository -- can use a plain download-artifact with no run-id
      # or actions: read scope of their own.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  crates:
    name: Publish crates.io
    needs: resolve
    if: ${{ inputs.publish-crates }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: publish-crates

      # What release.yml actually packaged. The build stages a PACKAGES file
      # beside the .crate files it produced; reading it here is what makes
      # "publish what was packaged" an enforced property rather than a claim
      # about two independently-edited caller inputs.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: staged
      - name: Resolve the package list
        id: packages
        env:
          INPUT_PACKAGES: ${{ inputs.crate-packages }}
        run: |
          set -euo pipefail
          built="$(find staged -name PACKAGES -print -quit || true)"
          if [[ -z "$built" ]]; then
            # A repository whose release build does not use release-rust.yml's
            # packaging job has nothing to bind to; its own input stands.
            echo "::notice::No PACKAGES in the build artifacts; using crate-packages as given."
            echo "list=$INPUT_PACKAGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          list="$(tr -s '[:space:]' ' ' < "$built" | sed 's/^ *//; s/ *$//')"
          want="$(tr -s '[:space:]' ' ' <<< "$INPUT_PACKAGES" | sed 's/^ *//; s/ *$//')"
          if [[ -n "$want" && "$want" != "$list" ]]; then
            echo "::error::The release build packaged '$list' but this workflow was asked to publish '$want'."
            echo "::error::These must match, including order: crates.io cannot undo a partial publish."
            exit 1
          fi
          echo "publishing exactly what was packaged: ${list:-<workspace root>}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: crates.io trusted publishing
        if: ${{ needs.resolve.outputs.publish-registries == 'true' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          REGISTRIES: ${{ needs.resolve.outputs.publish-registries }}
          PACKAGES: ${{ steps.packages.outputs.list }}
        run: |
          # --no-verify skips the verification compile, which is the only part
          # of cargo publish that would be a build on the tag path. The same
          # tree was compiled and tested on the release branch.
          args=(--locked --no-verify)
          if [[ "$REGISTRIES" != true ]]; then
            args+=(--dry-run)
            echo "Packaging only, nothing is uploaded (rehearsal, or a candidate on the base version)."
          fi
          if [[ -n "$PACKAGES" ]]; then
            # Dependency order matters: crates.io is the one target where a
            # partial publish cannot be undone by re-running the job.
            for pkg in $PACKAGES; do
              cargo publish -p "$pkg" "${args[@]}"
            done
          else
            cargo publish "${args[@]}"
          fi

  github-release:
    name: GitHub Release
    needs: [resolve, crates]
    if: always() && needs.resolve.result == 'success' && (needs.crates.result == 'success' || needs.crates.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Notes from the changelog
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          python3 - "$CHANGELOG" "$VERSION" <<'PY'
          import re, sys, pathlib
          path, version = sys.argv[1], sys.argv[2]
          base = version.split("-rc")[0]
          p = pathlib.Path(path)
          text = p.read_text(encoding="utf-8") if p.exists() else ""
          # The version must be a complete token: a prefix match picks the
          # '## [1.2.30]' section for release 1.2.3 and ships its notes.
          v = re.escape(base)
          m = re.search(rf"^## (?:\[{v}\]|{v}\b)[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else f"Release v{version}"
          if version != base:
              body = f"Release candidate for {base}.\n\n{body}"
          pathlib.Path("RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Latest?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          # A pre-release never becomes latest, and a maintenance back-port
          # never displaces a newer line.
          if [[ "$PRERELEASE" == true ]]; then
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
            | sed 's@refs/tags/v@@' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          newest="$(printf '%s\n%s\n' "$tags" "$VERSION" | sort -V | tail -1)"
          if [[ "$newest" == "$VERSION" ]]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        if: ${{ needs.resolve.outputs.publishing == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ inputs.release-files }}
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
          fail_on_unmatched_files: true

      - name: Rehearsal summary
        if: ${{ needs.resolve.outputs.publishing != 'true' }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "### Would have released $TAG"
            echo '```'
            cat RELEASE_NOTES.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
