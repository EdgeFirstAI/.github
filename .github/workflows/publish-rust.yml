name: publish-rust

# Tag side of the three-workflow release chain. See release-rust.yml.
#
# THIS WORKFLOW BUILDS NOTHING. It finds the release.yml run that built the
# artifacts for this tag, proves that run produced the tree the tag points at,
# downloads them and publishes. A missing artifact, an expired artifact or a
# tree mismatch fails the publish; there is deliberately no fallback to a
# build, because a deploy-only pipeline that cannot prove which build it is
# shipping is worse than one that rebuilds.
#
# The one exception is `cargo publish`, which has no pre-built input: it always
# packages from a source tree. It is bounded by --no-verify, so the tag path
# never runs a verification compile, and by the release branch having already
# compiled and tested the same tree.
#
# Publishing is gated on this being a real tag push. A workflow_dispatch
# resolves, verifies and downloads everything and then publishes nothing, which
# makes it a complete rehearsal at no cost. The gate lives here rather than in
# the caller so a caller cannot remove it by accident.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish; required for a workflow_dispatch rehearsal
        type: string
        default: ""
      build-workflow:
        description: Workflow file whose run built the artifacts
        type: string
        default: release.yml
      publish-crates:
        type: boolean
        default: true
      crate-packages:
        description: Space-separated -p arguments, in dependency order; empty publishes the workspace root
        type: string
        default: ""
      changelog:
        type: string
        default: CHANGELOG.md
      project-name:
        type: string
        default: ${{ github.event.repository.name }}
      require-sbom:
        type: boolean
        default: true
      release-files:
        description: Glob of staged files to attach to the GitHub Release
        type: string
        default: dist/*
      dry-run:
        description: Force a rehearsal even on a tag push
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.resolve.outputs.version }}
      tag:
        value: ${{ jobs.resolve.outputs.tag }}
      prerelease:
        value: ${{ jobs.resolve.outputs.prerelease }}
      build-run-id:
        value: ${{ jobs.resolve.outputs.run-id }}
      publishing:
        description: "false when this run is a rehearsal; gate caller publish jobs on it"
        value: ${{ jobs.resolve.outputs.publishing }}

jobs:
  resolve:
    name: Resolve build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      run-id: ${{ steps.run.outputs.id }}
      publishing: ${{ steps.tag.outputs.publishing }}
    steps:
      - name: Tag and mode
        id: tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          FORCE_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            tag="${REF#refs/tags/}"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            echo "::error::Not a tag push and no 'tag' input given — nothing to publish."
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::'$tag' is not vX.Y.Z or vX.Y.Z-rcN"
            exit 1
          fi
          version="${tag#v}"
          prerelease=false
          case "$version" in *-rc*) prerelease=true ;; esac

          # Publish only from a real tag push. Everything else rehearses.
          publishing=false
          if [[ "$EVENT" == push && "$REF" == refs/tags/* && "$FORCE_DRY_RUN" != true ]]; then
            publishing=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publishing=$publishing"
          } >> "$GITHUB_OUTPUT"
          if [[ "$publishing" == true ]]; then
            echo "### Publishing $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Rehearsal for $tag — nothing will be published" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Manifests match the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          base="${VERSION%-rc*}"
          fail=0
          check() {
            if [[ "$2" != "$base" ]]; then
              echo "::error file=$1::$1 version '$2' != tag version '$base'"
              fail=1
            else
              echo "ok  $1  $2"
            fi
          }
          if [[ -f Cargo.toml ]]; then
            found="$(grep -E '^version\s*=' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
            [[ -n "$found" ]] && check Cargo.toml "$found"
          fi
          if [[ -f pyproject.toml ]] && grep -qE '^version\s*=' pyproject.toml; then
            check pyproject.toml "$(grep -E '^version\s*=' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          if [[ -f VERSION ]]; then
            check VERSION "$(tr -d '[:space:]' < VERSION)"
          fi
          exit "$fail"

      - name: Find the run that built this tag
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD_WORKFLOW: ${{ inputs.build-workflow }}
        run: |
          branch="release/${VERSION}"
          run_json="$(gh api \
            "repos/${REPO}/actions/workflows/${BUILD_WORKFLOW}/runs?branch=${branch}&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] // empty')"
          if [[ -z "$run_json" ]]; then
            echo "::error::No successful ${BUILD_WORKFLOW} run on '${branch}'."
            echo "::error::The artifacts for ${TAG} are built by pushing to that branch; publish never builds them."
            exit 1
          fi
          run_id="$(jq -r '.id' <<<"$run_json")"
          build_sha="$(jq -r '.head_sha' <<<"$run_json")"

          # Bind the build to the tag by TREE, not by commit. A squash merge
          # gives the merge commit a different SHA from the release branch head
          # while the tree is identical, so commit equality is the wrong test.
          # A tree mismatch means main moved between the build and the merge and
          # these artifacts are not the artifacts for this tag.
          tag_tree="$(gh api "repos/${REPO}/commits/${TAG}" --jq '.commit.tree.sha')"
          build_tree="$(gh api "repos/${REPO}/commits/${build_sha}" --jq '.commit.tree.sha')"
          if [[ "$tag_tree" != "$build_tree" ]]; then
            echo "::error::Tree mismatch: ${TAG} is $tag_tree, run $run_id built $build_tree ($build_sha)."
            echo "::error::Rebase ${branch} onto main, let it rebuild, and re-cut the tag."
            exit 1
          fi

          expired="$(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts" \
            --jq '[.artifacts[] | select(.expired) | .name] | join(", ")')"
          if [[ -n "$expired" ]]; then
            echo "::error::Artifacts from run $run_id have expired: $expired"
            echo "::error::Raise retention-days on the release build; publish does not rebuild."
            exit 1
          fi

          echo "id=$run_id" >> "$GITHUB_OUTPUT"
          {
            echo "- build run: [$run_id](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${run_id})"
            echo "- build commit: \`${build_sha}\`"
            echo "- tree: \`${tag_tree}\` (matches ${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Require SBOM
        if: ${{ inputs.require-sbom }}
        run: |
          found="$(find dist -name 'sbom.json' | head -1 || true)"
          if [[ -z "$found" ]]; then
            echo "::error::sbom.json is required on every release and was not in the build artifacts"
            exit 1
          fi
          [[ "$found" == dist/sbom.json ]] || cp "$found" dist/sbom.json

      - name: Inventory
        run: |
          find dist -type f | sort | sed 's/^/  /' | tee -a "$GITHUB_STEP_SUMMARY"
          count="$(find dist -type f | wc -l | tr -d ' ')"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Build run produced no files"
            exit 1
          fi

      # Re-uploaded into THIS run so the caller's own publish jobs -- notably
      # the publish-pypi job that Trusted Publishing forces to stay in the
      # product repository -- can use a plain download-artifact with no run-id
      # or actions: read scope of their own.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  crates:
    name: Publish crates.io
    needs: resolve
    if: ${{ inputs.publish-crates }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false
      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          cache-key: publish-crates
      - name: crates.io trusted publishing
        if: ${{ needs.resolve.outputs.publishing == 'true' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISHING: ${{ needs.resolve.outputs.publishing }}
          PACKAGES: ${{ inputs.crate-packages }}
        run: |
          # --no-verify skips the verification compile, which is the only part
          # of cargo publish that would be a build on the tag path. The same
          # tree was compiled and tested on the release branch.
          args=(--locked --no-verify)
          if [[ "$PUBLISHING" != true ]]; then
            args+=(--dry-run)
            echo "Rehearsal: packaging only, nothing is uploaded."
          fi
          if [[ -n "$PACKAGES" ]]; then
            # Dependency order matters: crates.io is the one target where a
            # partial publish cannot be undone by re-running the job.
            for pkg in $PACKAGES; do
              cargo publish -p "$pkg" "${args[@]}"
            done
          else
            cargo publish "${args[@]}"
          fi

  github-release:
    name: GitHub Release
    needs: [resolve, crates]
    if: always() && needs.resolve.result == 'success' && (needs.crates.result == 'success' || needs.crates.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Notes from the changelog
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          python3 - "$CHANGELOG" "$VERSION" <<'PY'
          import re, sys, pathlib
          path, version = sys.argv[1], sys.argv[2]
          base = version.split("-rc")[0]
          p = pathlib.Path(path)
          text = p.read_text(encoding="utf-8") if p.exists() else ""
          m = re.search(rf"^## \[?{re.escape(base)}\]?[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else f"Release v{version}"
          if version != base:
              body = f"Release candidate for {base}.\n\n{body}"
          pathlib.Path("RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Latest?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          # A pre-release never becomes latest, and a maintenance back-port
          # never displaces a newer line.
          if [[ "$PRERELEASE" == true ]]; then
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
            | sed 's@refs/tags/v@@' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          newest="$(printf '%s\n%s\n' "$tags" "$VERSION" | sort -V | tail -1)"
          if [[ "$newest" == "$VERSION" ]]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        if: ${{ needs.resolve.outputs.publishing == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ inputs.release-files }}
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
          fail_on_unmatched_files: true

      - name: Rehearsal summary
        if: ${{ needs.resolve.outputs.publishing != 'true' }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "### Would have released $TAG"
            echo '```'
            cat RELEASE_NOTES.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
