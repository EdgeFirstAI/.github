name: rust-quick

on:
  workflow_call:
    inputs:
      python:
        description: Run ruff format/check (lint only)
        type: boolean
        default: false
      python-tests:
        description: Also run maturin develop + pytest. Implies python.
        type: boolean
        default: false
      ruff-paths:
        description: Paths for ruff. Empty lints the repository root.
        type: string
        default: ""
      ruff-version:
        description: >-
          Exact ruff version for uvx, e.g. 0.16.7. Empty keeps the current
          behaviour, where uvx resolves whatever the runner's uv cache holds
          -- not reproducible, and it drifts silently in both directions.
        type: string
        default: ""
      lfs:
        description: Fetch Git LFS files
        type: boolean
        default: false
      runner:
        description: GitHub-hosted runner label
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: Job budget (hal may pass 15)
        type: number
        default: 10
      cross-targets:
        description: Comma-separated rustc targets for check-only clippy
        type: string
        default: aarch64-unknown-linux-gnu
      skip-cross-clippy:
        type: boolean
        default: false
      nextest-args:
        type: string
        default: --workspace --locked
      clippy-args:
        type: string
        default: --workspace --all-targets --locked -- -D warnings
      project-name:
        description: Name for the dependency SBOM
        type: string
        default: ${{ github.event.repository.name }}
      cache-key:
        type: string
        default: quick-x86_64
      pre-command:
        description: Caller setup (OpenCV, ANGLE, testdata). Passed through env, never interpolated.
        type: string
        default: ""

jobs:
  quick:
    name: Quick
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      # Some org-provisioned larger runner images ship without git-lfs, and an
      # lfs checkout fails before any repo code exists to fix it.
      - name: Ensure git-lfs
        if: ${{ inputs.lfs && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            exit 0
          fi
          echo "::notice::git-lfs missing on this runner image; installing"
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}
          fetch-depth: 1

      - name: Checkout shared CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          # Contract: pre-command scripts may rely on GH_TOKEN / GITHUB_TOKEN
          # for gh and API calls (release asset downloads, etc). Nothing else
          # is guaranteed beyond the default runner environment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      - name: Setup Rust
        uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: ${{ !inputs.skip-cross-clippy && inputs.cross-targets || '' }}
          tools: nextest,cargo-cyclonedx
          cache-key: ${{ inputs.cache-key }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Setup Python / ruff
        if: inputs.python || inputs.python-tests
        uses: ./.ef-ci/.github/actions/setup-python-uv
        with:
          # Lint needs no project environment: uvx fetches ruff on its own.
          # Syncing would build the caller's package (maturin for binding
          # crates), which is Full-tier work and fails in a lint-only job.
          sync: ${{ inputs.python-tests }}

      - name: ruff
        if: inputs.python || inputs.python-tests
        env:
          RUFF_PATHS: ${{ inputs.ruff-paths }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          set -euo pipefail
          read -ra paths <<< "${RUFF_PATHS:-.}"
          if [[ ${#paths[@]} -eq 0 ]]; then
            paths=(.)
          fi
          ruff_spec="ruff${RUFF_VERSION:+@${RUFF_VERSION}}"
          if [[ -f pyproject.toml || -f ruff.toml || -n "${RUFF_PATHS}" ]]; then
            uvx "${ruff_spec}" format --check "${paths[@]}"
            uvx "${ruff_spec}" check "${paths[@]}"
          fi

      - name: Host clippy
        run: cargo clippy ${{ inputs.clippy-args }}

      - name: Cross-target clippy
        if: ${{ !inputs.skip-cross-clippy }}
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          CROSS_TARGETS: ${{ inputs.cross-targets }}
        run: |
          set -euo pipefail
          IFS=',' read -ra targets <<< "$CROSS_TARGETS"
          for target in "${targets[@]}"; do
            target="$(echo "$target" | xargs)"
            [[ -z "$target" ]] && continue
            rustup target add "$target"
            echo "clippy --target $target (check-only; native sysroots deferred to Full)"
            cargo clippy --target "$target" --workspace --locked --all-targets -- -D warnings
          done

      - name: nextest
        run: cargo nextest run ${{ inputs.nextest-args }}

      - name: Python bindings tests
        if: inputs.python-tests
        run: |
          if [[ -f pyproject.toml ]]; then
            uv pip install maturin pytest
            uv run maturin develop --locked || maturin develop --locked
            uv run pytest -q || pytest -q
          fi

      - name: Dependency license policy
        uses: ./.ef-ci/.github/actions/sbom-tools
        with:
          mode: dependency
          project-name: ${{ inputs.project-name }}
          upload-name: sbom-dependency
