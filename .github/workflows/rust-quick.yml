name: rust-quick

on:
  workflow_call:
    inputs:
      python:
        description: Run ruff format/check (lint only)
        type: boolean
        default: false
      python-tests:
        description: Also run maturin develop + pytest. Implies python.
        type: boolean
        default: false
      ruff-paths:
        description: Paths for ruff. Empty lints the repository root.
        type: string
        default: ""
      ruff-version:
        description: >-
          Exact ruff version for uvx, e.g. 0.16.7. Empty keeps the current
          behaviour, where uvx resolves whatever the runner's uv cache holds
          -- not reproducible, and it drifts silently in both directions.
        type: string
        default: ""
      lfs:
        description: Fetch Git LFS files
        type: boolean
        default: false
      runner:
        description: GitHub-hosted runner label
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: Job budget (hal may pass 15)
        type: number
        default: 10
      cross-targets:
        description: Comma-separated rustc targets for check-only clippy
        type: string
        default: aarch64-unknown-linux-gnu
      skip-cross-clippy:
        type: boolean
        default: false
      nextest-args:
        type: string
        default: --workspace --locked
      clippy-args:
        type: string
        default: --workspace --all-targets --locked -- -D warnings
      project-name:
        description: Name for the dependency SBOM
        type: string
        default: ${{ github.event.repository.name }}
      cache-key:
        type: string
        default: quick-x86_64
      cross-clippy-args:
        description: >-
          Arguments for the per-target check-only clippy pass. `--target
          <triple>` is prepended for each of `cross-targets`. A workspace
          containing a crate that cannot cross-compile -- a PyO3 extension
          with no interpreter for the target, anything needing a sysroot --
          narrows the pass here (`--exclude <crate>`) instead of turning the
          whole lane off with `skip-cross-clippy`, which is the only choice a
          fixed argument list leaves and costs the aarch64 lint coverage that
          an aarch64 product most needs.
        type: string
        default: --workspace --locked --all-targets -- -D warnings
      clippy-extra-args:
        description: >-
          A second host clippy pass, run only when set. A crate whose
          off-by-default features gate real code gets no PR signal from the
          default pass, and the nightly feature-combination lane is up to a
          day away. Empty runs one pass.
        type: string
        default: ""
      clippy-report:
        description: >-
          Emit a machine-readable clippy report and upload it as
          `clippy-report-<os>`, for a repository whose SonarCloud project
          imports it rather than letting Sonar compile the workspace itself.

          The self-compile is both slower and less accurate: Sonar's runner
          carries none of a repository's build dependencies, so a crate with a
          build script fails to analyse while the scan still reports clean.
          Measured on profiler: 171s of a 213s scan, with one crate silently
          unlinted.

          Rendered diagnostics are still printed. The JSON is a by-product of
          the same pass, not a replacement for readable output.
        type: boolean
        default: false
      workflow-lint:
        description: >-
          Run actionlint over .github/workflows and fail on an unpinned action
          reference. Hash-pinning is a standing requirement that nothing
          enforced, so a `@master` reference could sit in a repository until
          someone read the file.
        type: boolean
        default: true
      env:
        description: >-
          Newline-separated KEY=VALUE pairs exported for every later step.
          For build configuration a lane cannot infer -- PYO3_CROSS_*, OpenCV
          or CUDA roots, sysroot paths. Values are written verbatim and never
          interpolated into a script. Use `pre-command` for work, this for
          configuration.
        type: string
        default: ""
      pre-command:
        description: Caller setup (OpenCV, ANGLE, testdata). Passed through env, never interpolated.
        type: string
        default: ""

jobs:
  quick:
    name: Quick
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    defaults:
      run:
        # `runner` is caller-overridable and may name a Windows image, where
        # the default shell is PowerShell and the clippy and ruff blocks below
        # are bash. release-wheels.yml declares this for the same reason.
        shell: bash
    permissions:
      contents: read
    steps:
      # Some org-provisioned larger runner images ship without git-lfs, and an
      # lfs checkout fails before any repo code exists to fix it.
      - name: Ensure git-lfs
        if: ${{ inputs.lfs && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            exit 0
          fi
          echo "::notice::git-lfs missing on this runner image; installing"
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}
          fetch-depth: 1

      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          # Appended verbatim. A value is never interpolated into a script, and
          # a malformed line is rejected rather than silently dropped.
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"
          echo "Exported $(grep -c . <<< "$CALLER_ENV") caller environment line(s)."

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          # Contract: pre-command scripts may rely on GH_TOKEN / GITHUB_TOKEN
          # for gh and API calls (release asset downloads, etc). Nothing else
          # is guaranteed beyond the default runner environment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: ${{ !inputs.skip-cross-clippy && inputs.cross-targets || '' }}
          # rustup's std for a triple is not a C toolchain for it. The
          # cross-clippy pass below builds every build script in the tree, and
          # cc-rs needs a compiler for the target.
          cross-cc-targets: ${{ !inputs.skip-cross-clippy && inputs.cross-targets || '' }}
          tools: nextest,cargo-cyclonedx
          cache-key: ${{ inputs.cache-key }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Setup Python / ruff
        if: inputs.python || inputs.python-tests
        uses: $/.github/actions/setup-python-uv
        with:
          # Lint needs no project environment: uvx fetches ruff on its own.
          # Syncing would build the caller's package (maturin for binding
          # crates), which is Full-tier work and fails in a lint-only job.
          sync: ${{ inputs.python-tests }}

      - name: ruff
        if: inputs.python || inputs.python-tests
        env:
          RUFF_PATHS: ${{ inputs.ruff-paths }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          set -euo pipefail
          read -ra paths <<< "${RUFF_PATHS:-.}"
          if [[ ${#paths[@]} -eq 0 ]]; then
            paths=(.)
          fi
          ruff_spec="ruff${RUFF_VERSION:+@${RUFF_VERSION}}"
          if [[ -f pyproject.toml || -f ruff.toml || -n "${RUFF_PATHS}" ]]; then
            uvx "${ruff_spec}" format --check "${paths[@]}"
            uvx "${ruff_spec}" check "${paths[@]}"
          fi

      # `clippy_run` wraps every clippy pass below so the three of them append
      # to one report. Two details are load-bearing when reporting is on:
      #
      #   `set -o pipefail` -- without it `tee | jq` returns jq's status and a
      #   clippy failure reports success. A lane that goes green while finding
      #   nothing is the defect the hal migration turned up four times.
      #
      #   the jq render -- --message-format=json suppresses the human-readable
      #   diagnostic, and a failure that prints only raw JSON is unreadable.
      #
      # `tee -a`, so a later pass adds to the report rather than replacing it.
      - name: Clippy passes
        env:
          REPORT: ${{ inputs.clippy-report }}
          CLIPPY_ARGS: ${{ inputs.clippy-args }}
          EXTRA_ARGS: ${{ inputs.clippy-extra-args }}
          CROSS_TARGETS: ${{ inputs.cross-targets }}
          CROSS_ARGS: ${{ inputs.cross-clippy-args }}
          SKIP_CROSS: ${{ inputs.skip-cross-clippy }}
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          set -euo pipefail

          clippy_run() {
            if [[ "$REPORT" != "true" ]]; then
              # shellcheck disable=SC2068  # argument lists must split
              cargo clippy $@
              return
            fi
            set -o pipefail
            # shellcheck disable=SC2068  # argument lists must split
            cargo clippy --message-format=json $@ \
              | tee -a clippy-report.json \
              | jq -r 'select(.reason == "compiler-message") | .message.rendered // empty'
          }

          echo "::group::host clippy"
          # shellcheck disable=SC2086  # CLIPPY_ARGS is an argument list
          clippy_run $CLIPPY_ARGS
          echo "::endgroup::"

          if [[ -n "$EXTRA_ARGS" ]]; then
            echo "::group::host clippy (extra)"
            # shellcheck disable=SC2086  # EXTRA_ARGS is an argument list
            clippy_run $EXTRA_ARGS
            echo "::endgroup::"
          fi

          if [[ "$SKIP_CROSS" == "true" ]]; then
            exit 0
          fi
          IFS=',' read -ra targets <<< "$CROSS_TARGETS"
          for target in "${targets[@]}"; do
            target="$(echo "$target" | xargs)"
            [[ -z "$target" ]] && continue
            rustup target add "$target"
            echo "::group::clippy --target $target (check-only; native sysroots deferred to Full)"
            # shellcheck disable=SC2086  # CROSS_ARGS is an argument list
            clippy_run --target "$target" $CROSS_ARGS
            echo "::endgroup::"
          done

      # `always()`: the report is most useful on the run where clippy failed,
      # and a job that stopped at the first red step would upload nothing.
      # Named by OS so a repository aggregating several platforms' reports in
      # one Sonar scan can glob `clippy-report-*` without collisions.
      - name: Upload clippy report
        # `hashFiles` guards the case where the job died before clippy ran at
        # all: `if-no-files-found: error` would then add a second, misleading
        # red step on top of the real failure.
        if: ${{ always() && inputs.clippy-report && hashFiles('clippy-report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clippy-report-${{ runner.os }}
          path: clippy-report.json
          if-no-files-found: error
          retention-days: 7

      - name: nextest
        run: cargo nextest run ${{ inputs.nextest-args }}

      - name: Python bindings tests
        if: inputs.python-tests
        run: |
          if [[ -f pyproject.toml ]]; then
            uv pip install maturin pytest
            uv run maturin develop --locked || maturin develop --locked
            uv run pytest -q || pytest -q
          fi

      # Design principle: every action is hash-pinned. Nothing enforced it, so
      # a floating reference survived until someone happened to read the file.
      # actionlint also catches expression and shell errors in the caller's own
      # workflows, which otherwise only fail once the workflow runs.
      - name: Workflow lint
        if: ${{ inputs.workflow-lint }}
        uses: $/.github/actions/workflow-lint

      - name: Dependency license policy
        uses: $/.github/actions/sbom-tools
        with:
          mode: dependency
          project-name: ${{ inputs.project-name }}
          upload-name: sbom-dependency
