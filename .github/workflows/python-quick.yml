name: python-quick

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 10
      python-version:
        type: string
        default: "3.12"
      pytest-args:
        type: string
        default: -q
      ruff-version:
        description: >-
          Exact ruff version for uvx, e.g. 0.16.7. Empty resolves whatever
          the runner's uv cache holds.
        type: string
        default: ""
      extra-sync-args:
        type: string
        default: ""
      project-name:
        type: string
        default: ${{ github.event.repository.name }}

jobs:
  quick:
    name: Quick
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout shared CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Setup Python / uv
        uses: ./.ef-ci/.github/actions/setup-python-uv
        with:
          python-version: ${{ inputs.python-version }}
          extra-args: ${{ inputs.extra-sync-args }}

      - name: ruff
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          set -euo pipefail
          ruff_spec="ruff${RUFF_VERSION:+@${RUFF_VERSION}}"
          uvx "${ruff_spec}" format --check .
          uvx "${ruff_spec}" check .

      - name: pytest
        run: uv run pytest ${{ inputs.pytest-args }}

      - name: Dependency license policy
        uses: ./.ef-ci/.github/actions/sbom-tools
        with:
          mode: dependency
          project-name: ${{ inputs.project-name }}
          version-file: pyproject.toml
          upload-name: sbom-dependency
