name: python-quick

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 10
      python-version:
        type: string
        default: "3.12"
      pytest-args:
        type: string
        default: -q
      extra-sync-args:
        type: string
        default: ""
      project-name:
        type: string
        default: ${{ github.event.repository.name }}
      shared-sha:
        description: 40-char commit SHA of EdgeFirstAI/.github; must match the uses pin
        type: string
        required: true

jobs:
  quick:
    name: Quick
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout shared CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: EdgeFirstAI/.github
          ref: ${{ inputs.shared-sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Setup Python / uv
        uses: ./.ef-ci/.github/actions/setup-python-uv
        with:
          python-version: ${{ inputs.python-version }}
          extra-args: ${{ inputs.extra-sync-args }}

      - name: ruff
        run: |
          uvx ruff format --check .
          uvx ruff check .

      - name: pytest
        run: uv run pytest ${{ inputs.pytest-args }}

      - name: Dependency license policy
        uses: ./.ef-ci/.github/actions/sbom-tools
        with:
          mode: dependency
          project-name: ${{ inputs.project-name }}
          version-file: pyproject.toml
          upload-name: sbom-dependency
