name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            workflows:
              - '.github/**'
              - 'templates/**'

  lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c
          tar xzf actionlint.tgz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint -color
      - name: SHA-pin check
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          uses = re.compile(r"^\s*uses:\s*(.+)$")
          sha = re.compile(r"^[0-9a-fA-F]{40}$")
          roots = [pathlib.Path(".github"), pathlib.Path("templates")]
          fails = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.yml")):
                  for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      match = uses.match(line)
                      if not match:
                          continue
                      ref = match.group(1).split("#", 1)[0].strip().strip("'\"")
                      if ref.startswith("./") or ref.startswith(".ef-ci/") or ref.startswith("./.ef-ci/"):
                          continue
                      if "@" not in ref:
                          fails.append(f"{path}:{lineno}: missing pin: {line.strip()}")
                          continue
                      pin = ref.rsplit("@", 1)[-1]
                      if not sha.fullmatch(pin):
                          fails.append(f"{path}:{lineno}: unpinned: {line.strip()}")
          if fails:
              print("Third-party and reusable workflow refs must be 40-character SHAs:")
              print("\n".join(fails))
              sys.exit(1)
          print("all scanned uses: refs are SHA-pinned")
          PY
      - name: timeout-minutes check
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          missing = []
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              jobs = re.findall(r"^  ([a-zA-Z0-9_-]+):\n(?:.*\n)*?", text, re.M)
              # Each job that has runs-on must have timeout-minutes
              for block in re.split(r"\n  (?=[a-zA-Z0-9_-]+:)", text.split("jobs:\n", 1)[-1]):
                  if "runs-on:" in block and "timeout-minutes:" not in block:
                      missing.append(f"{path.name}: {block.splitlines()[0].rstrip(':')}")
          if missing:
              print("jobs missing timeout-minutes:")
              print("\n".join(missing))
              sys.exit(1)
          print("all runs-on jobs have timeout-minutes")
          PY
      - name: scancode CycloneDX mapping
        run: python3 .github/scripts/scancode_packages_to_cyclonedx.py --self-test

  ci-gate:
    if: always()
    needs: [changes, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
