name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            workflows:
              - '.github/**'
              - 'templates/**'

  lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The same action every product repository runs, so the policy has one
      # implementation rather than a copy here and a copy in rust-quick.yml.
      - name: Workflow lint
        uses: $/.github/actions/workflow-lint
        with:
          roots: .github templates

      - name: Template self-pin placeholder check
        run: |
          python3 - <<'EOP'
          import pathlib, re, sys
          # templates/ pins EdgeFirstAI/.github to all zeros on purpose. A
          # real SHA there is stale the moment this repository moves, and a
          # stale one still resolves: a copied skeleton then silently runs
          # old CI, or forwards an input the pinned revision does not
          # declare. Both have happened. The shape check above cannot catch
          # it, because a stale SHA is a valid SHA, so assert the
          # placeholder instead. Third-party actions in templates/ keep
          # real pins; only self-references are placeholders.
          placeholder = "0000000000000000000000000000000000000000"
          ref = re.compile(r"uses:\s*EdgeFirstAI/\.github/\S+@([0-9a-fA-F]{40})")
          bad = []
          for path in sorted(pathlib.Path("templates").rglob("*.yml")):
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = ref.search(line)
                  if match and match.group(1) != placeholder:
                      bad.append(f"{path}:{lineno}: {line.strip()}")
          if bad:
              print("templates/ must pin EdgeFirstAI/.github to the placeholder:")
              for item in bad:
                  print(item)
              sys.exit(1)
          print("all template self-pins use the placeholder")
          EOP
      - name: timeout-minutes check
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          missing = []
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              jobs = re.findall(r"^  ([a-zA-Z0-9_-]+):\n(?:.*\n)*?", text, re.M)
              # Each job that has runs-on must have timeout-minutes
              for block in re.split(r"\n  (?=[a-zA-Z0-9_-]+:)", text.split("jobs:\n", 1)[-1]):
                  if "runs-on:" in block and "timeout-minutes:" not in block:
                      missing.append(f"{path.name}: {block.splitlines()[0].rstrip(':')}")
          if missing:
              print("jobs missing timeout-minutes:")
              print("\n".join(missing))
              sys.exit(1)
          print("all runs-on jobs have timeout-minutes")
          PY
      - name: scancode CycloneDX mapping
        run: python3 .github/scripts/scancode_packages_to_cyclonedx.py --self-test

      - name: license policy evaluator
        run: python3 .github/scripts/check_license_policy.py --self-test

      - name: lane resolver
        run: python3 .github/scripts/resolve_lanes.py --self-test

      - name: runner converger
        run: python3 .github/scripts/apply_runners.py --self-test

      - name: wheel data staging
        run: python3 .github/scripts/stage_wheel_data.py --self-test

  ci-gate:
    if: always()
    needs: [changes, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
