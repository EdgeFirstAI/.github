name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: f
        with:
          filters: |
            workflows:
              - '.github/**'
              - 'templates/**'

  lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: taiki-e/install-action@47be02f2de8a32619316956f6117e150bdc6763f  # v2.62.44
        with:
          tool: actionlint
      - name: actionlint
        run: actionlint -color
      - name: SHA-pin check
        run: |
          set -euo pipefail
          fails=0
          while IFS= read -r line; do
            if echo "$line" | grep -Eq 'uses:[[:space:]]+[^./].*@(v[0-9]|main|master|stable)[[:space:]]*$'; then
              echo "unpinned: $line"
              fails=1
            fi
          done < <(grep -R --line-number -E 'uses:' .github/workflows .github/actions || true)
          if [[ "$fails" -ne 0 ]]; then
            echo "::error::Third-party actions must be SHA-pinned with a version comment"
            exit 1
          fi
      - name: timeout-minutes check
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          missing = []
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              jobs = re.findall(r"^  ([a-zA-Z0-9_-]+):\n(?:.*\n)*?", text, re.M)
              # Each job that has runs-on must have timeout-minutes
              for block in re.split(r"\n  (?=[a-zA-Z0-9_-]+:)", text.split("jobs:\n", 1)[-1]):
                  if "runs-on:" in block and "timeout-minutes:" not in block:
                      missing.append(f"{path.name}: {block.splitlines()[0].rstrip(':')}")
          if missing:
              print("jobs missing timeout-minutes:")
              print("\n".join(missing))
              sys.exit(1)
          print("all runs-on jobs have timeout-minutes")
          PY

  ci-gate:
    if: always()
    needs: [changes, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
