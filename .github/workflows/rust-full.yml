name: rust-full

on:
  workflow_call:
    inputs:
      lanes:
        description: all, hardware, or host
        type: string
        default: all
      boards:
        description: Comma-separated self-hosted board labels
        type: string
        default: ""
      nightly:
        type: boolean
        default: false
      python:
        type: boolean
        default: false
      lfs:
        type: boolean
        default: false
      runner-class-linux:
        description: hosted, fleet, or larger
        type: string
        default: hosted
      runner-class-linux-arm:
        type: string
        default: hosted
      runner-class-macos:
        type: string
        default: hosted
      runner-class-windows:
        type: string
        default: hosted
      timeout-minutes:
        type: number
        default: 30
      board-timeout-minutes:
        type: number
        default: 30
      project-name:
        type: string
        default: ${{ github.event.repository.name }}
      nextest-args:
        type: string
        default: --workspace --locked
      board-command:
        description: Override board execution (otherwise nextest archive)
        type: string
        default: ""
      sonar:
        type: boolean
        default: true
      skip-macos:
        type: boolean
        default: false
      skip-windows:
        type: boolean
        default: false
      scancode:
        type: boolean
        default: true
      env:
        description: >-
          Newline-separated KEY=VALUE pairs exported for every later step in
          every lane. For build configuration a lane cannot infer --
          PYO3_CROSS_*, OpenCV or CUDA roots, sysroot paths. Values are written
          verbatim and never interpolated into a script. Use `pre-command` for
          work, this for configuration.
        type: string
        default: ""
      pre-command:
        description: Caller setup (OpenCV, ANGLE, testdata). Passed through env, never interpolated.
        type: string
        default: ""
      board-pre-command:
        description: Board-only setup. Falls back to pre-command when empty.
        type: string
        default: ""
      hack-args:
        description: >-
          Arguments for the nightly `cargo hack check` feature-combination
          lane. `--locked` is always added. Set to an empty string to skip
          the lane entirely. A crate with mutually exclusive features needs
          `--exclude-no-default-features`, since the powerset otherwise
          builds a combination the crate deliberately rejects with
          `compile_error!`, which is a correct guard rather than a defect.
        type: string
        default: "--feature-powerset --depth 2"
      board-binaries:
        description: >-
          Newline-separated test binaries to run directly on the board, one per
          line as `<name-prefix>[=<filter>[,<filter>...]]`. Each binary runs in a
          SINGLE process. nextest runs one process per test, and on a GPU board
          each process pays a full driver init/teardown, which dominates both
          runtime and the per-process profraw footprint. Prefer this over
          board-extra-args for any board with a GPU.
        type: string
        default: ""
      board-min-tests:
        description: >-
          Fail the board lane if fewer than this many tests ran. A selection
          that matches nothing otherwise reports success.
        type: string
        default: "0"
      board-extra-args:
        description: Extra args for cargo nextest run on the board (e.g. -j 1). Not used for archive.
        type: string
        default: ""
      archive-args:
        description: Args for cargo nextest archive. Empty uses nextest-args (do not put -j 1 here).
        type: string
        default: ""
      archive-profile:
        description: >-
          Cargo profile for the on-target archive. A board has a small eMMC, so
          the default dev profile's full debug info can exhaust it. Set a
          release-like profile with debug = "line-tables-only".
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  setup:
    name: Lane setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.map.outputs.linux }}
      linux_arm: ${{ steps.map.outputs.linux_arm }}
      macos: ${{ steps.map.outputs.macos }}
      windows: ${{ steps.map.outputs.windows }}
      do_host: ${{ steps.map.outputs.do_host }}
      do_arm: ${{ steps.map.outputs.do_arm }}
      do_macos: ${{ steps.map.outputs.do_macos }}
      do_windows: ${{ steps.map.outputs.do_windows }}
      do_hardware: ${{ steps.map.outputs.do_hardware }}
      do_nightly: ${{ steps.map.outputs.do_nightly }}
      board_matrix: ${{ steps.map.outputs.board_matrix }}
      has_sonar: ${{ steps.sonar.outputs.present }}
      same_repo: ${{ steps.map.outputs.same_repo }}
    steps:
      # Shallow, and only so the sonar gate below can ask whether this
      # repository has a SonarCloud project at all. `hashFiles` is not
      # available in a job-level `if`, so the question is answered here and
      # passed down as an output.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - id: sonar
        run: |
          set -euo pipefail
          present=false
          [[ -f sonar-project.properties ]] && present=true
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - id: map
        env:
          LANES: ${{ inputs.lanes }}
          BOARDS: ${{ inputs.boards }}
          CLASS_LINUX: ${{ inputs.runner-class-linux }}
          CLASS_ARM: ${{ inputs.runner-class-linux-arm }}
          CLASS_MAC: ${{ inputs.runner-class-macos }}
          CLASS_WIN: ${{ inputs.runner-class-windows }}
          SKIP_MAC: ${{ inputs.skip-macos }}
          SKIP_WIN: ${{ inputs.skip-windows }}
          NIGHTLY: ${{ inputs.nightly }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          map_class() {
            local class="$1" kind="$2"
            case "$class" in
              hosted)
                case "$kind" in
                  linux) echo '"ubuntu-24.04"' ;;
                  linux-arm) echo '"ubuntu-24.04-arm"' ;;
                  macos) echo '"macos-latest"' ;;
                  windows) echo '"windows-latest"' ;;
                esac
                ;;
              fleet)
                case "$kind" in
                  linux) echo '["self-hosted","linux","x64","build"]' ;;
                  linux-arm) echo '["self-hosted","linux","arm64","build"]' ;;
                  macos) echo '["self-hosted","macos","arm64","metal"]' ;;
                  windows) echo '["self-hosted","windows","x64","d3d11"]' ;;
                esac
                ;;
              larger)
                # 24.04 to match the hosted class; the org provisions both.
                case "$kind" in
                  linux) echo '"ubuntu-24.04-xlarge"' ;;
                  linux-arm) echo '"ubuntu-24.04-arm-xlarge"' ;;
                  macos) echo '"macos-latest-xlarge"' ;;
                  # Requires an org-provisioned Windows larger runner; without
                  # one this label queues until the job times out.
                  windows) echo '"windows-latest-8-cores"' ;;
                esac
                ;;
              *)
                echo "::error::unknown runner-class '$class' (use hosted|fleet|larger)" >&2
                exit 1
                ;;
            esac
          }

          do_host=false
          do_hardware=false
          case "$LANES" in
            all) do_host=true; do_hardware=true ;;
            host) do_host=true ;;
            hardware) do_hardware=true ;;
            *) echo "::error::lanes must be all|host|hardware" >&2; exit 1 ;;
          esac

          same_repo=false
          if [[ "$EVENT" != pull_request || "$PR_HEAD_REPO" == "$REPO" ]]; then
            same_repo=true
          fi
          if [[ "$same_repo" != true ]]; then
            echo "::notice::fork PR: forcing hosted runners (fleet/larger are same-repo only)"
            CLASS_LINUX=hosted
            CLASS_ARM=hosted
            CLASS_MAC=hosted
            CLASS_WIN=hosted
          fi

          board_matrix='[]'
          if [[ -n "${BOARDS// /}" && "$do_hardware" == true && "$same_repo" == true ]]; then
            board_matrix="$(python3 -c 'import json,os; boards=[b.strip() for b in os.environ["BOARDS"].split(",") if b.strip()]; print(json.dumps([{"runner": b} for b in boards]))')"
          else
            do_hardware=false
          fi

          do_arm=false
          if [[ "$do_host" == true || "$do_hardware" == true ]]; then
            do_arm=true
          fi
          do_macos=false
          do_windows=false
          if [[ "$do_host" == true && "$SKIP_MAC" != true ]]; then do_macos=true; fi
          if [[ "$do_host" == true && "$SKIP_WIN" != true ]]; then do_windows=true; fi

          {
            echo "linux=$(map_class "$CLASS_LINUX" linux)"
            echo "linux_arm=$(map_class "$CLASS_ARM" linux-arm)"
            echo "macos=$(map_class "$CLASS_MAC" macos)"
            echo "windows=$(map_class "$CLASS_WIN" windows)"
            echo "do_host=$do_host"
            echo "do_arm=$do_arm"
            echo "do_macos=$do_macos"
            echo "do_windows=$do_windows"
            echo "do_hardware=$do_hardware"
            echo "do_nightly=$NIGHTLY"
            echo "same_repo=$same_repo"
            echo "board_matrix<<EOF"
            echo "$board_matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: Full linux
    needs: setup
    if: needs.setup.outputs.do_host == 'true'
    runs-on: ${{ fromJSON(needs.setup.outputs.linux) }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      # Org-provisioned larger runner images are more minimal than GitHub's
      # standard ones: ubuntu-24.04-arm-xlarge ships without git-lfs, so an
      # lfs checkout fails before any repo code exists to fix it. Install it
      # before the checkout rather than pinning the lane back to a standard
      # runner. Linux only; the hosted macOS and Windows images include it.
      - name: Ensure git-lfs
        if: ${{ inputs.lfs && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            exit 0
          fi
          echo "::notice::git-lfs missing on this runner image; installing"
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          # Contract: pre-command scripts may rely on GH_TOKEN / GITHUB_TOKEN
          # for gh and API calls (release asset downloads, etc). Nothing else
          # is guaranteed beyond the default runner environment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: rustfmt, clippy, llvm-tools-preview
          tools: nextest,cargo-llvm-cov
          cache-key: full-x86_64

      # Select the nextest profile up front. A `|| retry` here re-ran the
      # entire suite on a genuine test failure, doubling wall-clock before
      # reporting it.
      - name: Tests with coverage
        env:
          PROFILE_ARG: ${{ hashFiles('.config/nextest.toml') != '' && '--profile ci' || '' }}
        run: |
          # shellcheck disable=SC2086  # PROFILE_ARG carries "--profile ci" and must split
          cargo llvm-cov nextest --lcov --output-path coverage-linux.lcov \
            ${{ inputs.nextest-args }} $PROFILE_ARG

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-linux
          path: coverage-linux.lcov
          if-no-files-found: error
          retention-days: 7

  linux-arm:
    name: Full linux-arm
    needs: setup
    if: needs.setup.outputs.do_arm == 'true'
    runs-on: ${{ fromJSON(needs.setup.outputs.linux_arm) }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      # Org-provisioned larger runner images are more minimal than GitHub's
      # standard ones: ubuntu-24.04-arm-xlarge ships without git-lfs, so an
      # lfs checkout fails before any repo code exists to fix it. Install it
      # before the checkout rather than pinning the lane back to a standard
      # runner. Linux only; the hosted macOS and Windows images include it.
      - name: Ensure git-lfs
        if: ${{ inputs.lfs && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            exit 0
          fi
          echo "::notice::git-lfs missing on this runner image; installing"
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          # Contract: pre-command scripts may rely on GH_TOKEN / GITHUB_TOKEN
          # for gh and API calls (release asset downloads, etc). Nothing else
          # is guaranteed beyond the default runner environment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      - name: Upload merged testdata
        if: needs.setup.outputs.do_hardware == 'true' && inputs.lfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-testdata
          path: testdata/
          if-no-files-found: error
          retention-days: 1

      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: rustfmt, clippy, llvm-tools-preview
          tools: nextest,cargo-llvm-cov
          cache-key: full-aarch64

      - name: Tests with coverage
        if: needs.setup.outputs.do_host == 'true'
        run: |
          cargo llvm-cov nextest --lcov --output-path coverage-linux-arm.lcov \
            ${{ inputs.nextest-args }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.setup.outputs.do_host == 'true'
        with:
          name: coverage-linux-arm
          path: coverage-linux-arm.lcov
          if-no-files-found: error
          retention-days: 7

      - name: Archive instrumented tests
        if: needs.setup.outputs.do_hardware == 'true'
        env:
          CARGO_TARGET_DIR: target/llvm-cov-target
          RUSTFLAGS: "-C instrument-coverage"
          LLVM_PROFILE_FILE: "%p-%m.profraw"
          ARCHIVE_ARGS: ${{ inputs.archive-args }}
          NEXTEST_ARGS: ${{ inputs.nextest-args }}
          ARCHIVE_PROFILE: ${{ inputs.archive-profile }}
        run: |
          set -euo pipefail
          args="${ARCHIVE_ARGS:-$NEXTEST_ARGS}"
          profile_arg=""
          if [[ -n "$ARCHIVE_PROFILE" ]]; then
            profile_arg="--cargo-profile $ARCHIVE_PROFILE"
          fi
          # shellcheck disable=SC2086  # both are cargo argument lists and must split
          cargo nextest archive --archive-file nextest-archive.tar.zst $profile_arg $args
          test -d target/llvm-cov-target
          ls -lh nextest-archive.tar.zst

      # Boards run tests, never builds, so they have no cargo and no way to
      # fetch one: install-action needs jq, curl and a recognised distro, and
      # a Yocto board has none of them. Ship a statically linked aarch64
      # nextest next to the archive so the board can execute it directly.
      - name: Stage a static nextest for the board
        if: needs.setup.outputs.do_hardware == 'true'
        env:
          NEXTEST_URL: https://get.nexte.st/latest/linux-arm-musl
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-connrefused -o nextest.tar.gz "$NEXTEST_URL"
          tar xzf nextest.tar.gz cargo-nextest
          chmod +x cargo-nextest
          # Ships with debug_info; the board has no use for it and little room.
          strip cargo-nextest || llvm-strip cargo-nextest || true
          ls -lh cargo-nextest
          rm -f nextest.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.setup.outputs.do_hardware == 'true'
        with:
          name: nextest-archive-aarch64
          path: |
            nextest-archive.tar.zst
            cargo-nextest
          if-no-files-found: error
          retention-days: 1

      # cargo llvm-cov report only needs the instrumented test binaries to
      # resolve counters, not the whole target tree. Uploading the tree was
      # the bulk of the ~2 GB per run this tier used to move.
      - name: Collect instrumented binaries
        if: needs.setup.outputs.do_hardware == 'true'
        env:
          ARCHIVE_PROFILE: ${{ inputs.archive-profile }}
        run: |
          set -euo pipefail
          mkdir -p llvm-cov-binaries
          # Cargo writes the dev profile to debug/; a named profile uses its
          # own directory. The instrumented test executables cargo llvm-cov
          # report needs live in <profile>/deps, not directly in <profile>.
          profile_dir="${ARCHIVE_PROFILE:-debug}"
          [[ "$profile_dir" == "dev" ]] && profile_dir=debug
          find "target/llvm-cov-target/$profile_dir" -maxdepth 2 -type f -perm -u+x \
            ! -name '*.d' ! -name '*.rlib' ! -name '*.rmeta' \
            ! -name '*.so' ! -name '*.dylib' ! -name '*.a' \
            -exec cp -t llvm-cov-binaries {} +
          count="$(find llvm-cov-binaries -type f | wc -l)"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::collected no instrumented binaries; board coverage would be empty"
            echo "target/llvm-cov-target tree:"
            find target/llvm-cov-target -maxdepth 2 | head -40
            exit 1
          fi
          echo "collected $count instrumented binaries"
          du -sh llvm-cov-binaries

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.setup.outputs.do_hardware == 'true'
        with:
          name: rust-llvm-cov-aarch64
          path: llvm-cov-binaries
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Full macOS
    needs: setup
    if: needs.setup.outputs.do_macos == 'true'
    runs-on: ${{ fromJSON(needs.setup.outputs.macos) }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      # Org-provisioned larger runner images are more minimal than GitHub's
      # standard ones: ubuntu-24.04-arm-xlarge ships without git-lfs, so an
      # lfs checkout fails before any repo code exists to fix it. Install it
      # before the checkout rather than pinning the lane back to a standard
      # runner. Linux only; the hosted macOS and Windows images include it.
      - name: Ensure git-lfs
        if: ${{ inputs.lfs && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            exit 0
          fi
          echo "::notice::git-lfs missing on this runner image; installing"
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          # Contract: pre-command scripts may rely on GH_TOKEN / GITHUB_TOKEN
          # for gh and API calls (release asset downloads, etc). Nothing else
          # is guaranteed beyond the default runner environment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: rustfmt, clippy, llvm-tools-preview
          tools: nextest,cargo-llvm-cov
          cache-key: full-macos

      - run: cargo llvm-cov nextest --lcov --output-path coverage-macos.lcov ${{ inputs.nextest-args }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-macos
          path: coverage-macos.lcov
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Full Windows
    needs: setup
    if: needs.setup.outputs.do_windows == 'true'
    runs-on: ${{ fromJSON(needs.setup.outputs.windows) }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      # Org-provisioned larger runner images are more minimal than GitHub's
      # standard ones: ubuntu-24.04-arm-xlarge ships without git-lfs, so an
      # lfs checkout fails before any repo code exists to fix it. Install it
      # before the checkout rather than pinning the lane back to a standard
      # runner. Linux only; the hosted macOS and Windows images include it.
      - name: Ensure git-lfs
        if: ${{ inputs.lfs && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            exit 0
          fi
          echo "::notice::git-lfs missing on this runner image; installing"
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          # Contract: pre-command scripts may rely on GH_TOKEN / GITHUB_TOKEN
          # for gh and API calls (release asset downloads, etc). Nothing else
          # is guaranteed beyond the default runner environment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: rustfmt, clippy, llvm-tools-preview
          tools: nextest,cargo-llvm-cov
          cache-key: full-windows

      - shell: bash
        run: cargo llvm-cov nextest --lcov --output-path coverage-windows.lcov ${{ inputs.nextest-args }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-windows
          path: coverage-windows.lcov
          if-no-files-found: error
          retention-days: 7

  board:
    name: Board ${{ matrix.runner }}
    needs: [setup, linux-arm]
    if: needs.setup.outputs.do_hardware == 'true' && needs.setup.outputs.same_repo == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ fromJSON(inputs.board-timeout-minutes) }}
    concurrency:
      group: board-${{ matrix.runner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.board_matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"

      - name: Caller pre-command
        if: ${{ inputs.board-pre-command != '' || inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.board-pre-command != '' && inputs.board-pre-command || inputs.pre-command }}
          # Contract: pre-command scripts may rely on GH_TOKEN / GITHUB_TOKEN
          # for gh and API calls (release asset downloads, etc). Nothing else
          # is guaranteed beyond the default runner environment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      - name: Download merged testdata
        if: ${{ inputs.lfs }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ci-testdata
          path: testdata/

      - uses: ./.ef-ci/.github/actions/board-run
        with:
          command: ${{ inputs.board-command }}
          extra-args: ${{ inputs.board-extra-args }}
          binaries: ${{ inputs.board-binaries }}
          min-tests: ${{ inputs.board-min-tests }}
          archive-artifact: nextest-archive-aarch64
          profraw-artifact: coverage-hardware-${{ matrix.runner }}

  process-hardware-coverage:
    name: Merge board coverage
    needs: [setup, linux-arm, board]
    if: always() && needs.setup.outputs.do_hardware == 'true' && needs.linux-arm.result == 'success' && (needs.board.result == 'success' || needs.board.result == 'failure')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false
      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          tools: cargo-llvm-cov
          cache-key: full-aarch64-merge
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-hardware-*
          path: coverage-hardware
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: rust-llvm-cov-aarch64
          # deps/, not the profile root. cargo llvm-cov looks for instrumented
          # test executables under <profile>/deps, which is where the collect
          # step found them; unpacking the flat artifact into the profile root
          # leaves them one level too high and the report fails with "not found
          # object files". `report` defaults to the dev profile, so debug/ is
          # the directory it will search whatever profile built the archive --
          # it needs the objects, not a matching build.
          path: target/llvm-cov-target/debug/deps
      - name: Merge profraw
        run: |
          set -euo pipefail
          mkdir -p target/llvm-cov-target
          mapfile -t profs < <(find coverage-hardware -name '*.profraw' | sort)
          if [[ ${#profs[@]} -eq 0 ]]; then
            echo "::error::no board .profraw files downloaded"
            exit 1
          fi
          cp "${profs[@]}" target/llvm-cov-target/
          echo "merged ${#profs[@]} board profraw files"
          # The instrumented-binaries download is continue-on-error, so a miss
          # here otherwise surfaces as llvm-cov's opaque "not found object
          # files" rather than the artifact that did not arrive.
          # The -d test keeps a missing directory from aborting under
          # pipefail before the message below can be printed.
          objs=0
          if [[ -d target/llvm-cov-target/debug/deps ]]; then
            # An artifact round trip does not preserve the executable bit, so
            # every binary arrives 0644. cargo llvm-cov collects object files
            # by filtering on executability, so without this it reports "not
            # found object files" however correct the paths are -- which it
            # did with the binaries in the profile root and again in deps/.
            find target/llvm-cov-target/debug/deps -maxdepth 1 -type f ! -name '*.d' -exec chmod +x {} +
            objs=$(find target/llvm-cov-target/debug/deps -maxdepth 1 -type f -perm -u+x ! -name '*.d' | wc -l)
          fi
          if [[ "$objs" -eq 0 ]]; then
            echo "::error::no instrumented binaries in target/llvm-cov-target/debug/deps; the rust-llvm-cov-aarch64 artifact did not download"
            exit 1
          fi
          echo "found $objs instrumented binaries to attribute against"
          cargo llvm-cov report --lcov --output-path coverage-hardware.lcov
          echo "source files in report: $(grep -c '^SF:' coverage-hardware.lcov)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-hardware
          path: coverage-hardware.lcov
          if-no-files-found: error
          retention-days: 7

  scancode:
    name: Full SBOM
    needs: setup
    if: ${{ inputs.scancode && inputs.lanes != 'hardware' }}
    uses: ./.github/workflows/sbom.yml
    with:
      mode: full
      project-name: ${{ inputs.project-name }}
      timeout-minutes: 20

  nightly-extra:
    name: Feature combinations
    needs: setup
    # cargo audit used to live here too, which is why this was called "extras".
    # It moved to advisories.yml so it runs outside the nightly gate. What is
    # left is the hack lane, so skip the job entirely when the caller has no
    # hack-args rather than booting a runner to install tools and run nothing.
    if: ${{ inputs.nightly && inputs.hack-args != '' }}
    runs-on: ${{ fromJSON(needs.setup.outputs.linux) }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false
      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          # Contract: pre-command scripts may rely on GH_TOKEN / GITHUB_TOKEN
          # for gh and API calls (release asset downloads, etc). Nothing else
          # is guaranteed beyond the default runner environment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"
      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          tools: cargo-hack
          cache-key: nightly-extras
      - name: Feature combinations
        env:
          HACK_ARGS: ${{ inputs.hack-args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # HACK_ARGS is an argument list and must split
          cargo hack check $HACK_ARGS --locked

  verify-version:
    name: verify-version
    needs: setup
    if: startsWith(github.head_ref, 'release/') || startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tag matches manifest
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          version="${HEAD_REF#release/}"
          version="${version#v}"
          if [[ -f Cargo.toml ]]; then
            manifest="$(grep -E '^version\s*=' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
            if [[ "$manifest" != "$version" ]]; then
              echo "::error::Cargo.toml version $manifest != $version"
              exit 1
            fi
          fi
          if [[ -f VERSION ]]; then
            file_ver="$(tr -d '[:space:]' < VERSION)"
            if [[ "$file_ver" != "$version" ]]; then
              echo "::error::VERSION $file_ver != $version"
              exit 1
            fi
          fi
          echo "version $version matches"

  sonar:
    name: SonarCloud
    needs: [setup, linux, linux-arm, macos, windows, process-hardware-coverage]
    # Without sonar-project.properties the scan step was skipped but the job
    # still booted a runner, checked out, downloaded every coverage artifact
    # and merged lcov. Callers with no SonarCloud project paid that on every
    # Full run unless they knew to pass sonar:false. `hashFiles` is not
    # available in a job-level `if`, so `setup` answers it as an output.
    if: >-
      always() && inputs.sonar == true
      && needs.setup.outputs.do_host == 'true'
      && needs.linux.result == 'success'
      && needs.setup.outputs.has_sonar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Merge lcov
        run: |
          mkdir -p coverage
          mapfile -t files < <(find coverage -name '*.lcov' -o -name 'coverage*.lcov' | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No lcov files; Sonar will use last baseline"
            exit 0
          fi
          cat "${files[@]}" > coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        if: hashFiles('sonar-project.properties') != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            "-Dsonar.rust.lcov.reportPaths=coverage/lcov.info"
