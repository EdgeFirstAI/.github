name: tag-release

# Shared implementation of the byte-identical per-repo tag-release.yml.
# The caller owns the pull_request: closed trigger. This workflow must never
# interpolate github.event.pull_request.head.ref into bash via ${{ }} — that
# would be shell injection. HEAD_REF is passed through env instead.
#
# Creates an annotated tag object (not a lightweight ref) so `git describe`
# sees the release. Unsigned: signing needs a runner-held key.
#
# The tag only names the release; it never builds it. release.yml has already
# built and uploaded every artifact on pushes to the release branch, and
# publish.yml consumes them when this tag appears.

on:
  workflow_call:
    inputs:
      require-build:
        description: >
          Workflow file that must have a successful run for the merged PR's
          head commit before a tag is created. Empty disables the check, which
          is the default so a repository whose release still builds on the tag
          is not blocked mid-migration. Turn it on as part of the split.
        type: string
        default: ''
    secrets:
      RELEASE_TAG_TOKEN:
        required: true
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    name: Create annotated tag
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Derive version from branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#release/}"
          # release/X.Y.Z and release/X.Y.Z-rcN. The suffix is restricted to
          # -rc<digits> rather than the whole SemVer pre-release grammar: the
          # value is written unquoted to GITHUB_OUTPUT below, so the anchored
          # pattern is what keeps a branch name from forging a second output.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Branch '$HEAD_REF' is not a valid release/X.Y.Z or release/X.Y.Z-rcN branch"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Branch protection requires ci-gate and nothing else, and the release
      # build runs on a branch push rather than on the pull request, so a
      # release PR can merge while its build is pending or red. Refusing to
      # create the tag is where that is actually enforceable: a merged PR with
      # a broken build then leaves no tag rather than a tag nothing can honour.
      - name: Release build must be green for the release-branch head
        if: ${{ inputs.require-build }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BUILD_WORKFLOW: ${{ inputs.require-build }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          count="$(gh api \
            "repos/${REPO}/actions/workflows/${BUILD_WORKFLOW}/runs?head_sha=${HEAD_SHA}&status=success&per_page=1" \
            --jq '.workflow_runs | length')"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No successful ${BUILD_WORKFLOW} run for ${HEAD_SHA}."
            echo "::error::${TAG} was NOT created. A tag publishes artifacts that must already exist;"
            echo "::error::push the release branch again, let it build, then re-open and merge."
            exit 1
          fi
          echo "ok  ${BUILD_WORKFLOW} is green for ${HEAD_SHA}"

          # The build ran on the release-branch head; the tag goes on the merge
          # commit. Those are different objects, and they carry the same tree
          # only when main did not move between the build and the merge. When
          # it did, the tag names a tree nothing ever built -- publish binds by
          # tree and would reject it, but only after the tag exists and the
          # release ruleset has made it immutable.
          #
          # This is the backstop, not the primary check. rust-full.yml refuses a
          # release pull request whose branch is behind its base, which is the
          # same condition while it is still cheap to fix. By the time this
          # runs the merge has happened, so there is no "merge again" -- the
          # recovery below is the real one, and it is deliberately spelled out
          # rather than left to whoever reads a red workflow at release time.
          head_tree="$(gh api "repos/${REPO}/git/commits/${HEAD_SHA}" --jq '.tree.sha')"
          merge_tree="$(gh api "repos/${REPO}/git/commits/${MERGE_SHA}" --jq '.tree.sha')"
          if [[ "$head_tree" != "$merge_tree" ]]; then
            echo "::error::${TAG} was NOT created: the merge commit is not the tree that was built."
            echo "::error::  built  ${HEAD_SHA} -> tree ${head_tree}"
            echo "::error::  merged ${MERGE_SHA} -> tree ${merge_tree}"
            echo "::error::The base moved between the build and the merge, so ${MERGE_SHA} carries"
            echo "::error::a tree no release build produced. The release content is on the base"
            echo "::error::branch, untagged, and this pull request cannot be merged again."
            echo "::error::"
            echo "::error::To recover, build the merged tree and then tag it:"
            echo "::error::  1. Point the release branch at ${MERGE_SHA} and push it. That is a"
            echo "::error::     release/*.*.* push, so release.yml builds exactly this tree."
            echo "::error::  2. When it is green, create ${TAG} at ${MERGE_SHA} through the"
            echo "::error::     organisation tag-ruleset bypass, the same route a maintenance"
            echo "::error::     tag uses. publish.yml then binds to the build from step 1."
            echo "::error::Preferably do not get here: keep release branches up to date so the"
            echo "::error::pre-merge check in rust-full.yml catches this first."
            exit 1
          fi
          echo "ok  merge commit carries the tree that was built ($head_tree)"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TAG_TOKEN secret is not set — cannot create release tag."
            exit 1
          fi

          # POST git/refs alone creates a lightweight tag. Annotated tags are
          # created first via git/tags, then the ref is pointed at the tag object.
          kind=Release
          case "$TAG" in *-rc*) kind="Release candidate" ;; esac
          MESSAGE=$(printf '%s %s\n\n%s' "$kind" "$TAG" "$PR_URL")
          TAG_SHA=$(jq -n \
            --arg tag "$TAG" \
            --arg message "$MESSAGE" \
            --arg object "$MERGE_SHA" \
            --arg name "github-actions[bot]" \
            --arg email "support@edgefirst.ai" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, message: $message, object: $object, type: "commit",
              tagger: {name: $name, email: $email, date: $date}}' \
            | gh api "repos/${REPO}/git/tags" --input - --jq '.sha')

          if [ -z "$TAG_SHA" ]; then
            echo "::error::Failed to create annotated tag object for ${TAG}."
            exit 1
          fi

          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_SHA}"
