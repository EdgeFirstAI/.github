name: cmake-quick

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 15
      build-dir:
        type: string
        default: build
      configure-args:
        type: string
        default: -DCMAKE_BUILD_TYPE=Release
      ctest-args:
        type: string
        default: --output-on-failure
      ccache-key:
        type: string
        default: cmake-quick
      project-name:
        type: string
        default: ${{ github.event.repository.name }}

jobs:
  quick:
    name: Quick
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout caller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Resolve shared CI SHA
        id: ef-ci
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          sha="${WORKFLOW_REF##*@}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::github.workflow_ref must end in a 40-char SHA (got ${WORKFLOW_REF})"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout shared CI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: EdgeFirstAI/.github
          ref: ${{ steps.ef-ci.outputs.sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Install ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache cmake

      - name: ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/ccache
          key: ${{ inputs.ccache-key }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ inputs.ccache-key }}-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B ${{ inputs.build-dir }} ${{ inputs.configure-args }}

      - name: Build
        run: cmake --build ${{ inputs.build-dir }} --parallel

      - name: Test
        run: ctest --test-dir ${{ inputs.build-dir }} ${{ inputs.ctest-args }}

      # NOTICE is required on Quick. C/C++ dependency graphs have no fast
      # CycloneDX generator; those are enforced by Full scancode.
      - name: NOTICE and dependency license policy
        uses: ./.ef-ci/.github/actions/sbom-tools
        with:
          mode: dependency
          project-name: ${{ inputs.project-name }}
          version-file: VERSION
          upload-name: sbom-dependency
