name: cmake-quick

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 15
      build-dir:
        type: string
        default: build
      configure-args:
        type: string
        default: -DCMAKE_BUILD_TYPE=Release
      ctest-args:
        type: string
        default: --output-on-failure
      ccache-key:
        type: string
        default: cmake-quick
      project-name:
        type: string
        default: ${{ github.event.repository.name }}

jobs:
  quick:
    name: Quick
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout shared CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Install ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache cmake

      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ inputs.ccache-key }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ inputs.ccache-key }}-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B ${{ inputs.build-dir }} ${{ inputs.configure-args }}

      - name: Build
        run: cmake --build ${{ inputs.build-dir }} --parallel

      - name: Test
        run: ctest --test-dir ${{ inputs.build-dir }} ${{ inputs.ctest-args }}

      # NOTICE is required on Quick. C/C++ dependency graphs have no fast
      # CycloneDX generator; those are enforced by Full scancode.
      - name: NOTICE and dependency license policy
        uses: ./.ef-ci/.github/actions/sbom-tools
        with:
          mode: dependency
          project-name: ${{ inputs.project-name }}
          version-file: VERSION
          upload-name: sbom-dependency
