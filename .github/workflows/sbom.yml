name: sbom

on:
  workflow_call:
    inputs:
      mode:
        description: dependency or full
        type: string
        default: dependency
      project-name:
        type: string
        default: ${{ github.event.repository.name }}
      project-type:
        type: string
        default: library
      version-file:
        type: string
        default: Cargo.toml
      source-dirs:
        type: string
        default: src tests crates
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 20
      targets:
        description: Space-separated extra Rust target triples for the dependency graph
        type: string
        default: ''
      extra-manifests:
        description: Space-separated Cargo.toml paths outside the workspace
        type: string
        default: ''
      upload-name:
        type: string
        default: sbom

jobs:
  sbom:
    name: SBOM (${{ inputs.mode }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout shared CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Setup Rust
        if: hashFiles('Cargo.toml') != ''
        uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: rustfmt
          tools: cargo-cyclonedx
          cache-key: sbom-${{ inputs.mode }}

      - name: SBOM + license policy
        uses: ./.ef-ci/.github/actions/sbom-tools
        with:
          mode: ${{ inputs.mode }}
          project-name: ${{ inputs.project-name }}
          project-type: ${{ inputs.project-type }}
          version-file: ${{ inputs.version-file }}
          source-dirs: ${{ inputs.source-dirs }}
          targets: ${{ inputs.targets }}
          extra-manifests: ${{ inputs.extra-manifests }}
          upload-name: ${{ inputs.upload-name }}
