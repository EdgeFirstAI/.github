# Dependency or full SBOM with the license policy, for any repository.
#
# A Python project whose uv.lock pins private packages to the index named
# `codeartifact` sets `codeartifact-role`: the job assumes it through GitHub
# OIDC and exports a token for that index before the dependency environment
# is built, as python-quick.yml does. The call site then grants
# `contents: read` and `id-token: write`. Empty `codeartifact-role` changes
# nothing.
#
# An application whose requirements install a vendor package the tree does not
# hold (a wheel under the gitignored ext/) stages it with `pre-command`, as
# release-image.yml's `pre-build-command` does for the image. With
# `pre-command-role` the command runs with that role's AWS credentials, assumed
# through OIDC, and they are cleared before the SBOM is built; the call site
# then grants `id-token: write`.
name: sbom

on:
  workflow_call:
    inputs:
      mode:
        description: dependency or full
        type: string
        default: dependency
      project-name:
        type: string
        default: ${{ github.event.repository.name }}
      project-type:
        type: string
        default: library
      version-file:
        type: string
        default: Cargo.toml
      source-dirs:
        type: string
        default: src tests crates
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 20
      targets:
        description: Space-separated extra Rust target triples for the dependency graph
        type: string
        default: ''
      extra-manifests:
        description: Space-separated Cargo.toml paths outside the workspace
        type: string
        default: ''
      python-requirements:
        description: Space-separated requirements files an application's image installs; they are the Python inventory even when the repository has a pyproject.toml
        type: string
        default: ''
      python-version:
        description: Python the Python dependency environment is built on, the one the code runs on; empty keeps the runner's
        type: string
        default: ''
      upload-name:
        type: string
        default: sbom
      retention-days:
        description: Artifact retention; empty keeps the per-mode default (full 7, dependency 1)
        type: string
        default: ''
      codeartifact-role:
        description: >-
          IAM role ARN that can read the CodeArtifact repository, assumed
          through OIDC, so the Python dependency environment can install
          packages that uv.lock pins to the index named `codeartifact`. Its
          trust policy must name this repository. Empty skips CodeArtifact.
        type: string
        default: ""
      codeartifact-domain:
        description: CodeArtifact domain, e.g. `edgefirst`. Required with codeartifact-role.
        type: string
        default: ""
      codeartifact-repository:
        description: CodeArtifact repository, e.g. `dve`. Required with codeartifact-role.
        type: string
        default: ""
      aws-region:
        description: >-
          Region of the CodeArtifact domain and of pre-command-role. Empty
          uses the organisation variable AWS_REGION.
        type: string
        default: ""
      pre-command:
        description: >-
          Shell run from the repository root before the SBOM is built. Stages
          what the requirements install but the tree does not hold: vendor
          packages. Receives no secrets. Empty skips it.
        type: string
        default: ""
      pre-command-role:
        description: >-
          IAM role ARN assumed through OIDC for pre-command alone, such as a
          Studio app's build role (vars.AWS_STUDIO_BUILD_ROLE_ARN), which can
          read that app's vendor SDKs. Its trust policy must allow the calling
          ref. Empty runs pre-command without AWS credentials.
        type: string
        default: ""

jobs:
  sbom:
    name: SBOM (${{ inputs.mode }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    # No `permissions:` block, for the reason given in python-quick.yml: the
    # job takes what the call site grants, `id-token: write` included when
    # codeartifact-role is set.
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Rust
        if: hashFiles('Cargo.toml') != ''
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt
          tools: cargo-cyclonedx
          cache-key: sbom-${{ inputs.mode }}

      # uv is what reads the CodeArtifact credentials, so a CodeArtifact
      # project gets it even without python-version.
      - name: Setup Python
        if: inputs.python-version != '' || inputs.codeartifact-role != ''
        uses: $/.github/actions/setup-python-uv
        with:
          python-version: ${{ inputs.python-version }}
          sync: "false"
          # Never cache private packages; see the README's "Private Python packages".
          enable-cache: ${{ inputs.codeartifact-role == '' && inputs.codeartifact-domain == '' && inputs.codeartifact-repository == '' }}

      # 30 minutes: the tool installs and the scancode cache restore in
      # sbom-tools come before the dependency environment is built.
      - name: CodeArtifact login
        if: ${{ inputs.codeartifact-role != '' || inputs.codeartifact-domain != '' || inputs.codeartifact-repository != '' }}
        uses: $/.github/actions/codeartifact-login
        with:
          role-arn: ${{ inputs.codeartifact-role }}
          domain: ${{ inputs.codeartifact-domain }}
          repository: ${{ inputs.codeartifact-repository }}
          aws-region: ${{ inputs.aws-region || vars.AWS_REGION }}
          format: uv
          duration-seconds: "1800"

      - name: Assume the pre-command role
        if: ${{ inputs.pre-command-role != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ inputs.pre-command-role }}
          aws-region: ${{ inputs.aws-region || vars.AWS_REGION }}
          role-session-name: sbom-pre-command

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      # Empty values, which the AWS CLI and SDKs treat as unset, so nothing
      # after pre-command runs with the role.
      - name: Clear the pre-command role
        if: ${{ always() && inputs.pre-command-role != '' }}
        run: |
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"

      - name: SBOM + license policy
        uses: $/.github/actions/sbom-tools
        with:
          mode: ${{ inputs.mode }}
          project-name: ${{ inputs.project-name }}
          project-type: ${{ inputs.project-type }}
          version-file: ${{ inputs.version-file }}
          source-dirs: ${{ inputs.source-dirs }}
          targets: ${{ inputs.targets }}
          extra-manifests: ${{ inputs.extra-manifests }}
          python-requirements: ${{ inputs.python-requirements }}
          python-version: ${{ inputs.python-version }}
          upload-name: ${{ inputs.upload-name }}
          retention-days: ${{ inputs.retention-days }}
