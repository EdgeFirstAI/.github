name: release-rust

# Release-branch side of the three-workflow release chain.
#
#   release.yml   push to release/*.*.*  -> BUILD every artifact   (this file)
#   tag-release.yml  release PR merged   -> annotated vX.Y.Z tag
#   publish.yml   push of a v*.*.* tag   -> PUBLISH what was built
#
# A tag deploys and never builds. Anything a tag builds is built where no pull
# request can run it, so its failures are only ever found after the tag exists.
# Accepting the release PR is the gate instead: it cannot merge until this
# workflow is green, which means every artifact the release will ship exists.
#
# THIS WORKFLOW DOES NOT BUILD THE ARTIFACTS. The build belongs to the calling
# repository, beside this call in its own release.yml, because it is the one
# part of a release that is genuinely repository-specific: hal ships five
# wheels across eight targets plus ten C-API archives with codesigning, schemas
# ships ten wheels, videostream ships C. A shared matrix guessing at that was
# carried here through 1.0.0 and never ran in any repository, in either the
# scratch repo or a product one. What is shared is everything around the build
# -- version consistency, the SBOM, and the publish side in publish-rust.yml.
#
# The caller uploads its artifacts with actions/upload-artifact and
# retention-days: 30 or more. publish-rust.yml finds this run by branch and
# verifies its tree against the tag before downloading them.

on:
  workflow_call:
    inputs:
      project-name:
        type: string
        default: ${{ github.event.repository.name }}
      changelog:
        description: Changelog path; empty skips the changelog section check
        type: string
        default: CHANGELOG.md
      sbom:
        description: Run the full scancode SBOM as part of the release build
        type: boolean
        default: true
      sbom-targets:
        type: string
        default: ""
      sbom-extra-manifests:
        type: string
        default: ""
      crate-packages:
        description: >-
          Space-separated `-p` arguments, in dependency order, to package with
          `cargo package --locked`. Empty packages the workspace root; the
          literal string `none` skips packaging entirely for a repository that
          publishes no crate. The resulting `.crate` files are uploaded, so a
          packaging failure -- an excluded file, a path dependency without a
          version, a dirty tree -- is a red release PR rather than a failure
          inside `cargo publish` on the tag. Pass the SAME list to
          `publish-rust.yml`: it publishes what this packaged.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 20
    outputs:
      version:
        description: X.Y.Z or X.Y.Z-rcN, from the release branch name
        value: ${{ jobs.verify-version.outputs.version }}
      tag:
        description: The tag tag-release.yml will create on merge
        value: ${{ jobs.verify-version.outputs.tag }}
      prerelease:
        value: ${{ jobs.verify-version.outputs.prerelease }}

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Version from release branch
        id: version
        env:
          # Never interpolated into the script text; a ref name may contain
          # shell metacharacters.
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            release/*) version="${REF_NAME#release/}" ;;
            *)
              echo "::error::release-rust.yml runs on a release branch; got '$REF_NAME'."
              echo "::error::Trigger it with: on: push: branches: ['release/*.*.*']"
              exit 1
              ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Branch '$REF_NAME' is not release/X.Y.Z or release/X.Y.Z-rcN"
            exit 1
          fi
          prerelease=false
          case "$version" in *-rc*) prerelease=true ;; esac
          {
            echo "value=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version (prerelease=$prerelease)" >> "$GITHUB_STEP_SUMMARY"

      - name: Manifests match the branch
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # On a pre-release branch the manifests may carry either the base
          # version (1.2.0) or the exact pre-release spelling. The choice
          # decides whether the candidate can reach crates.io and PyPI at all,
          # because a registry version is immutable: publishing 1.2.0 from
          # release/1.2.0-rc1 permanently consumes the version the final
          # release needs. It is reported here rather than discovered at
          # the tag, where nothing can be undone.
          base="${VERSION%-rc*}"
          fail=0
          exact=1
          check() {
            local file="$1" found="$2"
            if [[ "$found" == "$VERSION" ]]; then
              echo "ok  $file  $found  (exact)"
            elif [[ "$found" == "$base" ]]; then
              [[ "$VERSION" == "$base" ]] || exact=0
              echo "ok  $file  $found"
            else
              echo "::error file=$file::$file version '$found' is neither '$VERSION' nor '$base'"
              fail=1
            fi
          }
          if [[ -f Cargo.toml ]]; then
            found="$(grep -E '^version\s*=' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
            [[ -n "$found" ]] && check Cargo.toml "$found"
          fi
          if [[ -f pyproject.toml ]] && grep -qE '^version\s*=' pyproject.toml; then
            check pyproject.toml "$(grep -E '^version\s*=' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          if [[ -f VERSION ]]; then
            check VERSION "$(tr -d '[:space:]' < VERSION)"
          fi

          # A workspace that versions its internal crates through
          # [workspace.dependencies] carries the release version in one place
          # per member on top of [workspace.package]. Bumping only the latter
          # leaves each member depending on the PREVIOUS release of its
          # sibling -- a version that exists on crates.io, so cargo publishes
          # it without complaint and ships a wrong dependency graph. Nothing
          # downstream catches that: `cargo package` resolves the path
          # dependency locally, and the tag only ever sees the result.
          if [[ -f Cargo.toml ]] && grep -q '^\[workspace.dependencies\]' Cargo.toml; then
            while IFS= read -r line; do
              dep="${line%%[[:space:]]*}"
              dep="${dep%%=*}"
              dep="$(echo "$dep" | xargs)"
              [[ -n "$dep" ]] || continue
              # Only members of this workspace: a path dependency that also
              # declares a version is what gets published.
              [[ "$line" == *path\ =* || "$line" == *path=* ]] || continue
              found="$(sed -n 's/.*[^-a-z]version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' <<< "$line" | head -1)"
              [[ -n "$found" ]] || continue
              check "Cargo.toml [workspace.dependencies.$dep]" "$found"
            done < <(sed -n '/^\[workspace.dependencies\]/,/^\[/p' Cargo.toml | grep -E '^[A-Za-z0-9_-]+[[:space:]]*=.*path')
          fi

          if [[ "$fail" -eq 0 && "$exact" -eq 0 ]]; then
            echo "::notice::Manifests carry $base, not $VERSION. publish.yml will attach the artifacts to a GitHub pre-release and SKIP crates.io and PyPI, so the final release can still claim $base. Give the manifests the pre-release version if the candidate should reach the registries."
            echo "- registries: **skipped** for this candidate (manifests carry \`$base\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$fail"

      - name: Changelog has a section
        if: ${{ inputs.changelog != '' }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          base="${VERSION%-rc*}"
          if [[ ! -f "$CHANGELOG" ]]; then
            echo "::error::$CHANGELOG not found"
            exit 1
          fi
          # publish.yml builds the GitHub Release body from this section. An
          # absent section is a release with empty notes, discovered after the
          # tag exists; catching it here makes it a red release PR instead.
          # The version must be a complete token. A prefix match accepts
          # '## [1.2.30]' as the section for 1.2.3 and ships the wrong notes.
          esc="${base//./\\.}"
          if ! grep -qE "^## (\[${esc}\]|${esc}([[:space:]]|$))" "$CHANGELOG"; then
            echo "::error file=$CHANGELOG::no '## [$base]' section in $CHANGELOG"
            exit 1
          fi
          echo "ok  $CHANGELOG has a section for $base"

  # `publish-rust.yml` runs `cargo publish --no-verify`, which skips the
  # verification compile precisely so the tag path builds nothing. That is only
  # safe because packaging was already exercised on the release branch -- here.
  package:
    name: Package crates
    needs: verify-version
    if: ${{ inputs.crate-packages != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: ""
          cache-key: release-package

      - name: cargo package
        env:
          PACKAGES: ${{ inputs.crate-packages }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$PACKAGES" ]]; then
            # Dependency order matters: packaging a crate whose sibling is a
            # path+version dependency resolves that sibling locally, so the
            # order here is the order publish-rust.yml will upload in.
            for pkg in $PACKAGES; do
              args+=(-p "$pkg")
            done
          fi
          cargo package --locked "${args[@]}"
          ls -la target/package/*.crate
          {
            echo "### Packaged crates"
            for f in target/package/*.crate; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error
          # The release-PR-to-tag gap is human-paced; publish.yml fails on an
          # expired artifact rather than rebuilding.
          retention-days: 30

  sbom:
    name: Release SBOM
    needs: verify-version
    if: ${{ inputs.sbom }}
    uses: ./.github/workflows/sbom.yml
    with:
      mode: full
      project-name: ${{ inputs.project-name }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      targets: ${{ inputs.sbom-targets }}
      extra-manifests: ${{ inputs.sbom-extra-manifests }}
      upload-name: sbom
      # publish.yml requires this SBOM after the release PR merges, which is
      # human-paced. The 7-day CI default would expire a release held a week.
      retention-days: "30"
