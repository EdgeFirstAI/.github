name: release-wheels

# Build Python wheels for a PyO3/maturin package on a release branch.
#
# Called from a repository's `release.yml`, beside `release-rust.yml`. It
# builds and uploads; it publishes nothing. `publish-rust.yml` collects what
# this produced, and the caller's own `publish-pypi` job uploads it, because
# PyPI Trusted Publishing matches `job_workflow_ref` in the publishing
# repository and a reusable workflow cannot be the publisher.
#
# It exists because the wheel matrix was the one part of the release every
# repository wrote for itself, and it is also where the tag-path failures
# were: a runner image without git-lfs, the same image without a C compiler, a
# toolchain component conflict. Those are properties of the build environment,
# not of any one repository, so they are fixed once here.
#
# Retention is 30 days and `if-no-files-found: error`, both non-negotiable:
# the release-PR-to-tag gap is human-paced, and a silently empty artifact
# becomes a silently incomplete release.

on:
  workflow_call:
    inputs:
      manifest:
        description: >-
          Path to the binding crate's Cargo.toml. The simple form, for a
          repository shipping one binding. A workspace shipping several uses
          `builds` instead.
        type: string
        default: ""
      builds:
        description: >-
          JSON array of {manifest, features, args} objects built in this job,
          for a workspace shipping more than one binding. `features` and `args`
          are optional and override the workflow-level `features` and add to
          the matrix entry's `args`.

          It exists because the reusable-workflow boundary is per job, so one
          call per binding means one job per binding: hal ships five
          distributions and builds each for abi3-py311 and abi3-py38, which is
          forty jobs across four platforms against the four it runs today, each
          paying its own checkout, toolchain, cache restore and link. Looping
          inside the job keeps one `target/` and one warm cache.

          A matrix entry in `runners` may carry its own `builds` to override
          this for that platform, which is how a caller builds an sdist on one
          platform only.
        type: string
        default: ""
      runners:
        description: >-
          JSON array of one object per wheel target. `name` labels the lane and
          the artifact, `runner` is the image, and `args` is appended to
          `maturin build`.

          An entry may also carry `builds` and `maturin-spec`, each overriding
          the workflow-level input for that lane alone. `maturin-spec` is what
          a repository shipping Linux and non-Linux wheels needs: `zig` is what
          produces the manylinux wheels, while `patchelf` is a Linux-only PyPI
          package with no wheel for macOS or Windows, so one specification
          cannot serve both. There is no working around it in `pre-command`,
          which runs before `setup-python` — an install there lands in the
          system interpreter and is overwritten by the step below.

          The default builds manylinux2014 wheels for x86_64 and aarch64 Linux,
          with the sdist on x86_64 only, which is what every EdgeFirst binding
          ships today.
        type: string
        # runner-class: larger -- a wheel build compiles, and this runs once
        # per push to a release branch rather than once per push to a PR, so
        # the default spends billed minutes to shorten it. The billed class is
        # offered, not required: a caller naming the hosted labels here has
        # priced the trade the other way, which the runner selection policy
        # allows.
        default: >-
          [{"name": "x86_64-linux", "runner": "ubuntu-24.04-xlarge",
            "args": "--sdist --zig --compatibility manylinux2014"},
           {"name": "aarch64-linux", "runner": "ubuntu-24.04-arm-xlarge",
            "args": "--zig --compatibility manylinux2014"}]
      python-version:
        type: string
        default: "3.11"
      maturin-spec:
        description: >-
          pip requirement for maturin, for every lane that does not override it
          in `runners`.

          Empty, the default, lets each lane derive it from its own runner OS:
          `zig` is what produces the manylinux wheels and `patchelf` is a
          Linux-only PyPI package with no wheel for macOS or Windows, so a
          value set here is a value every lane gets whether it can install it
          or not. Set it to pin a maturin version for reproducibility, and
          expect to override it per lane in `runners` if the matrix is not
          all one OS.
        type: string
        default: ""
      features:
        description: Cargo features for the wheel build, e.g. pyo3/abi3-py311
        type: string
        default: ""
      lfs:
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 45
      artifact-prefix:
        description: >-
          Artifact name prefix. `publish-rust.yml` downloads every artifact
          from the run, so this only has to be unique within it.
        type: string
        default: wheels
      payloads:
        description: >-
          JSON array of artifact names to download from THIS run into
          `payload/<name>/` before `pre-command`, for a wheel whose native
          content is built by another job. A matrix entry may carry its own
          `payloads` key, overriding this for that lane alone -- which is what
          a per-architecture shim or a per-target binary needs.

          Downloading is all this input does. `wheel-data` below is what
          places the files, for either binding mode; `pre-command` and
          `post-command` remain available for a caller whose staging is not
          expressible as a copy.

          An artifact that is missing or empty fails the lane. A wheel whose
          native payload silently did not arrive is worse than no wheel: it
          installs, and fails at first use on a version PyPI will not let you
          replace.
        type: string
        default: ""
      wheel-data:
        description: >-
          JSON array of `{from, scheme, path, mode, wheel}` objects placing
          files into the built wheel's `.data/` directory, applied after the
          build and before `post-command`. A matrix entry may carry its own
          `wheel-data` key, overriding this for that lane alone.

          This works for every binding mode, which is the reason it exists.
          maturin honours a `<module>.data/` directory staged before the build
          only for a binding that produces a Python module; a
          `bindings = "bin"` wheel has no such directory. Unpacking and
          repacking the finished wheel serves both, and a caller no longer has
          to know which case it is in.

          `mode` is not cosmetic: the Actions artifact store does not preserve
          the executable bit, so a console script staged from a sibling job
          arrives 0644 and fails at first use.

          See the `wheel-data` action for the full field reference.
        type: string
        default: ""
      pre-command:
        description: Caller setup, run from the repository root before the build.
        type: string
        default: ""
      post-command:
        description: >-
          Caller assertions over the built wheels, run from the repository root
          after the build and before the upload. Same contract as
          `pre-command`. A wheel that fails here never reaches the artifact
          store, which is the point: publish.yml ships what the build produced
          without re-examining it, and a PyPI version is immutable.
        type: string
        default: ""
      env:
        description: Newline-separated KEY=VALUE pairs exported for every later step.
        type: string
        default: ""
      attest:
        description: >-
          Generate build provenance for the wheels, in the job that built them
          and after `post-command` has accepted them. The calling job must
          grant `id-token: write` and `attestations: write`; see
          templates/release.yml.
        type: boolean
        default: true
      verify-version:
        description: >-
          Check that each built wheel's version matches the release branch.
          A wheel carrying the wrong version publishes to the wrong PyPI
          release, and the version is immutable once uploaded.
        type: boolean
        default: true

jobs:
  wheels:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
      # `payloads` reads artifacts produced by sibling jobs in this run.
      # Without it the hooks below cannot reach one, and a caller cannot add a
      # permission to a reusable workflow's job -- so a wheel whose native
      # content is built elsewhere would have no route into this workflow at
      # all. Read-only, and scoped to the run's own artifacts.
      actions: read
      # Provenance is generated here rather than wherever the wheels are later
      # uploaded from, so the attestation describes the build. A caller that
      # sets `attest: false` may drop these two.
      id-token: write
      attestations: write
    defaults:
      run:
        # `runners` is caller-overridable and may name a Windows image, where
        # the default shell is PowerShell and every block below is bash.
        shell: bash
    strategy:
      # One broken target must not hide the state of the others: a release
      # needs to know everything that is wrong in one run, not one thing per
      # push.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.runners) }}
    steps:
      # Some org-provisioned runner images ship without git-lfs, and an lfs
      # checkout fails before any repository code exists to fix it.
      - name: Ensure git-lfs
        if: ${{ inputs.lfs && runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          command -v git-lfs >/dev/null 2>&1 && exit 0
          echo "::notice::git-lfs missing on this runner image; installing"
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}

      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"

      # Before `pre-command`, so a staging script finds its payload on disk.
      #
      # GITHUB_RUN_ID inside a reusable workflow is the CALLER's run, which is
      # what makes a sibling job's artifact reachable -- the same property
      # publish.yml relies on when it downloads a release build by run-id.
      #
      # Each artifact lands in its own directory rather than being merged. Two
      # artifacts may legitimately carry the same filename for different
      # targets, and overwriting one with the other produces a wheel for the
      # wrong architecture that nothing downstream can detect.
      - name: Download caller payloads
        if: ${{ (toJSON(matrix.payloads) != 'null' && toJSON(matrix.payloads) || inputs.payloads) != '' }}
        env:
          PAYLOADS: ${{ toJSON(matrix.payloads) != 'null' && toJSON(matrix.payloads) || inputs.payloads }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Validated before the loop: `jq` inside the process substitution
          # below runs in a subshell whose failure `set -e` does not see, so a
          # malformed or non-array value would download nothing and let the
          # lane build a wheel without the payload it was told to place.
          if ! jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' \
               >/dev/null 2>&1 <<<"$PAYLOADS"; then
            echo "::error::payloads must be a JSON array of non-empty artifact names; got: $PAYLOADS"
            exit 1
          fi
          mkdir -p payload
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            echo "::group::payload $name"
            gh run download "$GITHUB_RUN_ID" --name "$name" --dir "payload/$name"
            if [[ -z "$(find "payload/$name" -type f -print -quit)" ]]; then
              echo "::error::payload artifact '$name' is empty"
              exit 1
            fi
            find "payload/$name" -type f
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$PAYLOADS")

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      # The repository's own pin, so a wheel is built with the compiler its
      # tests ran on. Also the C compiler check below: a maturin build shells
      # out to cc for any crate with a build script, and a runner image without
      # one fails deep inside a dependency rather than here.
      - uses: $/.github/actions/setup-rust
        with:
          components: ""
          cache-key: release-wheels-${{ matrix.name }}

      # setup-rust above guarantees a C compiler. git is checked here because
      # maturin shells out to it for a vendored source, and the failure is
      # otherwise reported from inside a dependency that does not name it.
      - name: git present
        run: |
          set -euo pipefail
          if command -v git >/dev/null 2>&1; then
            echo "ok  git is present"
            exit 0
          fi
          if [[ "$RUNNER_OS" != Linux ]]; then
            echo "::error::git is absent from this $RUNNER_OS image."
            exit 1
          fi
          echo "::notice::installing git (absent from this runner image)"
          sudo apt-get update
          sudo apt-get install -y git

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      # Install, build and verify. The body of this job lives in a
      # composite action so that a repository whose matrix does not fit this
      # workflow -- hal builds five distributions twice each, interleaved with
      # an SDK fetch and two Mach-O assertions -- gets the same implementation
      # without this workflow growing a hook for every interleaving.
      - uses: $/.github/actions/maturin-build
        with:
          # A matrix entry may carry its own build list, so one platform can
          # produce the sdist while the others do not. `runners` is parsed by
          # fromJSON, so this arrives as an array rather than as text --
          # toJSON serialises it back, and yields the string `null` when the
          # entry has no `builds` key at all.
          builds: ${{ toJSON(matrix.builds) != 'null' && toJSON(matrix.builds) || inputs.builds }}
          manifest: ${{ inputs.manifest }}
          features: ${{ inputs.features }}
          args: ${{ matrix.args }}
          # Bracket syntax because the key has a hyphen: `matrix.maturin-spec`
          # parses as a subtraction. Empty at both levels lets the action
          # derive it from the runner OS, which is what it is a property of.
          maturin-spec: ${{ matrix['maturin-spec'] || inputs.maturin-spec }}
          verify-version: ${{ inputs.verify-version }}
          lane: ${{ matrix.name }}
          # Attested below instead, after `post-command`. The action attests as
          # soon as it has built, which is right when it is called directly but
          # wrong here: a wheel this workflow is about to reject would already
          # carry provenance.
          attest: false

      # Between the build and `post-command`, and the position is forced from
      # both sides. `wheel pack` recomputes RECORD, so the repacked wheel is a
      # different artifact with a different digest: after the attestation
      # below it would publish provenance for a wheel nobody can install.
      # After `post-command` it would change a wheel the caller has already
      # asserted over, and those assertions exist to describe what ships.
      - name: Place files into the wheels
        if: ${{ (toJSON(matrix['wheel-data']) != 'null' && toJSON(matrix['wheel-data']) || inputs.wheel-data) != '' }}
        uses: $/.github/actions/wheel-data
        with:
          # Bracket syntax because the key has a hyphen: `matrix.wheel-data`
          # parses as a subtraction. `runners` is parsed by fromJSON, so a
          # matrix entry's value arrives as an array and toJSON serialises it
          # back, yielding the string `null` when the key is absent.
          entries: ${{ toJSON(matrix['wheel-data']) != 'null' && toJSON(matrix['wheel-data']) || inputs.wheel-data }}

      # Runs before the upload, deliberately. A wheel that fails a caller's
      # own assertion must never reach the artifact store, because
      # publish.yml's whole contract is that it ships what the build produced
      # without re-examining it -- and a PyPI version is immutable, so a bad
      # wheel discovered later cannot be replaced.
      #
      # hal is the motivating case: rustc strips Apple binaries with its own
      # in-process Mach-O writer, which leaves the LINKEDIT string pool
      # 4-byte aligned whenever a binary's nindirectsyms is odd, and dyld on
      # macOS 26+ then refuses to load the wheel. The parity is a coin flip per
      # binary, so an import smoke test on one build proves nothing about the
      # next; the check parses every wheel instead.
      - name: Caller post-command
        if: ${{ inputs.post-command != '' }}
        env:
          POST_COMMAND: ${{ inputs.post-command }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$POST_COMMAND"

      # After the caller's assertions and before the upload, so provenance
      # covers exactly the set that reaches the artifact store. Attesting
      # earlier would describe a wheel `post-command` is about to reject, which
      # is provenance for something nobody can install; attesting later is not
      # possible, because the upload is what publish.yml consumes.
      - name: Attest build provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: target/wheels/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.name }}
          # Matches the maturin-build action's `wheel-dir` default, which is
          # what it passes to maturin as --out. This workflow does not expose
          # that input, so the two agree by construction; exposing it means
          # changing both.
          path: target/wheels/*
          if-no-files-found: error
          retention-days: 30
