name: release-wheels

# Build Python wheels for a PyO3/maturin package on a release branch.
#
# Called from a repository's `release.yml`, beside `release-rust.yml`. It
# builds and uploads; it publishes nothing. `publish-rust.yml` collects what
# this produced, and the caller's own `publish-pypi` job uploads it, because
# PyPI Trusted Publishing matches `job_workflow_ref` in the publishing
# repository and a reusable workflow cannot be the publisher.
#
# It exists because the wheel matrix was the one part of the release every
# repository wrote for itself, and it is also where the tag-path failures
# were: a runner image without git-lfs, the same image without a C compiler, a
# toolchain component conflict. Those are properties of the build environment,
# not of any one repository, so they are fixed once here.
#
# Retention is 30 days and `if-no-files-found: error`, both non-negotiable:
# the release-PR-to-tag gap is human-paced, and a silently empty artifact
# becomes a silently incomplete release.

on:
  workflow_call:
    inputs:
      manifest:
        description: >-
          Path to the binding crate's Cargo.toml. The simple form, for a
          repository shipping one binding. A workspace shipping several uses
          `builds` instead.
        type: string
        default: ""
      builds:
        description: >-
          JSON array of {manifest, features, args} objects built in this job,
          for a workspace shipping more than one binding. `features` and `args`
          are optional and override the workflow-level `features` and add to
          the matrix entry's `args`.

          It exists because the reusable-workflow boundary is per job, so one
          call per binding means one job per binding: hal ships five
          distributions and builds each for abi3-py311 and abi3-py38, which is
          forty jobs across four platforms against the four it runs today, each
          paying its own checkout, toolchain, cache restore and link. Looping
          inside the job keeps one `target/` and one warm cache.

          A matrix entry in `runners` may carry its own `builds` to override
          this for that platform, which is how a caller builds an sdist on one
          platform only.
        type: string
        default: ""
      runners:
        description: >-
          JSON array of one object per wheel target. `name` labels the lane and
          the artifact, `runner` is the image, and `args` is appended to
          `maturin build`.

          An entry may also carry `builds` and `maturin-spec`, each overriding
          the workflow-level input for that lane alone. `maturin-spec` is what
          a repository shipping Linux and non-Linux wheels needs: `zig` is what
          produces the manylinux wheels, while `patchelf` is a Linux-only PyPI
          package with no wheel for macOS or Windows, so one specification
          cannot serve both. There is no working around it in `pre-command`,
          which runs before `setup-python` — an install there lands in the
          system interpreter and is overwritten by the step below.

          The default builds manylinux2014 wheels for x86_64 and aarch64 Linux,
          with the sdist on x86_64 only, which is what every EdgeFirst binding
          ships today.
        type: string
        # runner-class: larger -- a wheel build compiles, so the runner
        # selection policy puts it on the larger class; it runs once per push
        # to a release branch, not per push to a PR. A caller that wants the
        # free class names the hosted labels here deliberately.
        default: >-
          [{"name": "x86_64-linux", "runner": "ubuntu-24.04-xlarge",
            "args": "--sdist --zig --compatibility manylinux2014"},
           {"name": "aarch64-linux", "runner": "ubuntu-24.04-arm-xlarge",
            "args": "--zig --compatibility manylinux2014"}]
      python-version:
        type: string
        default: "3.11"
      maturin-spec:
        description: >-
          pip requirement for maturin, for every lane that does not override it
          in `runners`. Pinned by the caller when a release must be
          reproducible against one maturin version.
        type: string
        default: maturin[patchelf,zig]
      features:
        description: Cargo features for the wheel build, e.g. pyo3/abi3-py311
        type: string
        default: ""
      lfs:
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 45
      artifact-prefix:
        description: >-
          Artifact name prefix. `publish-rust.yml` downloads every artifact
          from the run, so this only has to be unique within it.
        type: string
        default: wheels
      pre-command:
        description: Caller setup, run from the repository root before the build.
        type: string
        default: ""
      post-command:
        description: >-
          Caller assertions over the built wheels, run from the repository root
          after the build and before the upload. Same contract as
          `pre-command`. A wheel that fails here never reaches the artifact
          store, which is the point: publish.yml ships what the build produced
          without re-examining it, and a PyPI version is immutable.
        type: string
        default: ""
      env:
        description: Newline-separated KEY=VALUE pairs exported for every later step.
        type: string
        default: ""
      verify-version:
        description: >-
          Check that each built wheel's version matches the release branch.
          A wheel carrying the wrong version publishes to the wrong PyPI
          release, and the version is immutable once uploaded.
        type: boolean
        default: true

jobs:
  wheels:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
    defaults:
      run:
        # `runners` is caller-overridable and may name a Windows image, where
        # the default shell is PowerShell and every block below is bash.
        shell: bash
    strategy:
      # One broken target must not hide the state of the others: a release
      # needs to know everything that is wrong in one run, not one thing per
      # push.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.runners) }}
    steps:
      # Some org-provisioned runner images ship without git-lfs, and an lfs
      # checkout fails before any repository code exists to fix it.
      - name: Ensure git-lfs
        if: ${{ inputs.lfs && runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          command -v git-lfs >/dev/null 2>&1 && exit 0
          echo "::notice::git-lfs missing on this runner image; installing"
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ef-ci
          persist-credentials: false

      - name: Caller environment
        if: ${{ inputs.env != '' }}
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line// }" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env line is not KEY=VALUE: $line"
              exit 1
            fi
            echo "${line#"${line%%[![:space:]]*}"}" >> "$GITHUB_ENV"
          done <<< "$CALLER_ENV"

      - name: Caller pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$PRE_COMMAND"

      # The repository's own pin, so a wheel is built with the compiler its
      # tests ran on. Also the C compiler check below: a maturin build shells
      # out to cc for any crate with a build script, and a runner image without
      # one fails deep inside a dependency rather than here.
      - uses: ./.ef-ci/.github/actions/setup-rust
        with:
          components: ""
          cache-key: release-wheels-${{ matrix.name }}

      # maturin shells out to a C compiler for any dependency with a build
      # script, and to git for a vendored source. A runner image missing
      # either fails deep inside a dependency with an error that names
      # neither. On Linux the gap is closed here rather than reported, which
      # is the difference between this being fixed centrally and merely being
      # detected earlier. On macOS the toolchain is a property of the image
      # and cannot be installed in-line, so there the check reports and stops.
      #
      # Windows is checked for git only. A Windows toolchain is MSVC, which
      # presents as `cl.exe` rather than `cc` and is normally not on PATH at
      # all: the `cc` crate locates it through vswhere and the registry, so
      # requiring a command here would reject an image that builds perfectly
      # well. Verifying MSVC properly means initialising the developer
      # environment, which belongs in the caller's `pre-command` for the one
      # repository that needs it, not in a preflight for everyone.
      - name: Build toolchain
        run: |
          set -euo pipefail
          need=()
          command -v git >/dev/null 2>&1 || need+=(git)
          if [[ "$RUNNER_OS" != Windows ]]; then
            command -v cc >/dev/null 2>&1 || need+=(build-essential)
          fi
          if [[ ${#need[@]} -eq 0 ]]; then
            if [[ "$RUNNER_OS" == Windows ]]; then
              echo "ok  git present; MSVC is located by the cc crate, not by PATH"
            else
              echo "ok  cc and git are present"
            fi
            exit 0
          fi
          if [[ "$RUNNER_OS" != Linux ]]; then
            echo "::error::missing ${need[*]} on this $RUNNER_OS image, and it cannot be installed in-line."
            echo "::error::Use a runner image that provides the build toolchain."
            exit 1
          fi
          echo "::notice::installing ${need[*]} (absent from this runner image)"
          sudo apt-get update
          sudo apt-get install -y "${need[@]}"
          command -v cc >/dev/null 2>&1 || { echo "::error::cc still absent after install"; exit 1; }

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install maturin
        env:
          MATURIN_SPEC: ${{ inputs.maturin-spec }}
          # Bracket syntax because the key has a hyphen: `matrix.maturin-spec`
          # parses as a subtraction. A scalar, so unlike `builds` it needs no
          # toJSON -- an absent key renders as the empty string.
          MATURIN_SPEC_MATRIX: ${{ matrix['maturin-spec'] }}
        run: |
          set -euo pipefail
          spec="${MATURIN_SPEC_MATRIX:-}"
          [[ -n "$spec" ]] || spec="$MATURIN_SPEC"
          if [[ -z "$spec" ]]; then
            echo "::error::no maturin specification for lane '${{ matrix.name }}'"
            exit 1
          fi
          echo "installing $spec"
          pip install "$spec"

      - name: Build wheels
        env:
          MANIFEST: ${{ inputs.manifest }}
          BUILDS: ${{ inputs.builds }}
          # A matrix entry may carry its own build list, so one platform can
          # produce the sdist while the others do not. `runners` is parsed by
          # fromJSON, so this arrives as an array rather than as text --
          # toJSON serialises it back, and yields the string `null` when the
          # entry has no `builds` key at all.
          BUILDS_MATRIX: ${{ toJSON(matrix.builds) }}
          MATURIN_ARGS: ${{ matrix.args }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail

          builds=""
          if [[ -n "${BUILDS_MATRIX:-}" && "$BUILDS_MATRIX" != null ]]; then
            builds="$BUILDS_MATRIX"
          elif [[ -n "${BUILDS:-}" ]]; then
            builds="$BUILDS"
          fi
          # A caller may pass the list as JSON text rather than as a JSON
          # array -- unavoidable for the workflow-level input, which is typed
          # string. Unwrap one level so both spellings behave the same.
          if [[ -n "$builds" ]] && jq -e 'type == "string"' >/dev/null 2>&1 <<< "$builds"; then
            builds="$(jq -r '.' <<< "$builds")"
          fi

          if [[ -n "$builds" ]]; then
            :
          elif [[ -n "$MANIFEST" ]]; then
            builds="$(jq -nc --arg m "$MANIFEST" --arg f "$FEATURES" \
              '[{manifest: $m, features: $f}]')"
          else
            echo "::error::release-wheels needs either 'manifest' or 'builds'."
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0' >/dev/null 2>&1 <<< "$builds"; then
            echo "::error::'builds' is not a non-empty JSON array: $builds"
            exit 1
          fi

          # Read from a process substitution rather than a pipeline, so the
          # loop runs in this shell and a failing build aborts the step.
          while IFS= read -r entry; do
            m="$(jq -r '.manifest // empty' <<< "$entry")"
            if [[ -z "$m" ]]; then
              echo "::error::build entry has no manifest: $entry"
              exit 1
            fi
            f="$(jq -r '.features // empty' <<< "$entry")"
            [[ -n "$f" ]] || f="$FEATURES"
            extra="$(jq -r '.args // empty' <<< "$entry")"

            args=(--release --locked -m "$m")
            [[ -n "$f" ]] && args+=(--features "$f")
            echo "==> $m ${f:+($f)}"
            # shellcheck disable=SC2086  # both are argument lists and must split
            maturin build "${args[@]}" $MATURIN_ARGS $extra
          done < <(jq -c '.[]' <<< "$builds")

          ls -la target/wheels/

      # A wheel's version comes from the manifest, and verify-version has
      # already checked the manifest against the branch -- but only for the
      # files it knows about. A binding whose version is derived some other way
      # (a build script, a dynamic backend) can still produce a wheel naming a
      # version this release is not. PyPI versions are immutable, so a wrong
      # one is discovered when it can no longer be corrected.
      - name: Wheel version matches the release branch
        if: ${{ inputs.verify-version }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF_NAME" in
            release/*) version="${REF_NAME#release/}" ;;
            *)
              echo "::notice::Not a release branch ($REF_NAME); skipping the wheel version check."
              exit 0
              ;;
          esac
          # PEP 440 spells a candidate 1.2.0rc1 where the branch says
          # 1.2.0-rc1, and a wheel filename replaces '-' with '_'.
          pep440="${version//-rc/rc}"
          base="${version%-rc*}"
          fail=0
          shopt -s nullglob
          for whl in target/wheels/*.whl target/wheels/*.tar.gz; do
            name="$(basename "$whl")"
            found="$(sed -E 's/^[^-]+-([^-]+)-.*\.whl$/\1/; s/^.*-([0-9][^-]*)\.tar\.gz$/\1/' <<< "$name")"
            if [[ "$found" == "$pep440" || "$found" == "$base" ]]; then
              echo "ok  $name  ($found)"
            else
              echo "::error::$name carries version '$found', expected '$pep440' or '$base'"
              fail=1
            fi
          done
          exit "$fail"

      # Runs before the upload, deliberately. A wheel that fails a caller's
      # own assertion must never reach the artifact store, because
      # publish.yml's whole contract is that it ships what the build produced
      # without re-examining it -- and a PyPI version is immutable, so a bad
      # wheel discovered later cannot be replaced.
      #
      # hal is the motivating case: rustc strips Apple binaries with its own
      # in-process Mach-O writer, which leaves the LINKEDIT string pool
      # 4-byte aligned whenever a binary's nindirectsyms is odd, and dyld on
      # macOS 26+ then refuses to load the wheel. The parity is a coin flip per
      # binary, so an import smoke test on one build proves nothing about the
      # next; the check parses every wheel instead.
      - name: Caller post-command
        if: ${{ inputs.post-command != '' }}
        env:
          POST_COMMAND: ${{ inputs.post-command }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$POST_COMMAND"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.name }}
          path: target/wheels/*
          if-no-files-found: error
          retention-days: 30
