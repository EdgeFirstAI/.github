version: 2
updates:
  # One scan covers workflows plus every composite action. Without a shared
  # directories list Dependabot opens one grouped PR per directory (and one
  # version-update job each), which is what flooded inboxes after v1.0.0.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
